      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
