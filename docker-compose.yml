          </div>
          <p class="muted small">Dominio sin frameworks · Dependencias hacia el núcleo · Java 21 · Python · PostgreSQL · Docker Compose · Prometheus · Grafana</p>
        </footer>
        
        <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
        </body>
