        RUN mvn -B -ntp verify
        
        FROM eclipse-temurin:21-jre-jammy AS runtime
        RUN apt-get update && apt-get install -y --no-install-recommends curl \
            && rm -rf /var/lib/apt/lists/* \
            && groupadd --gid 10001 app && useradd --uid 10001 --gid app --no-create-home app
        WORKDIR /app
        COPY --from=build --chown=10001:10001 /build/target/order-api.jar ./order-api.jar
        USER 10001:10001
        EXPOSE 8080 9090
        ENTRYPOINT ["java", "-XX:+ExitOnOutOfMemoryError", "-jar", "/app/order-api.jar"]
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: orders
      DB_USER: orders
      DB_PASSWORD_FILE: /run/secrets/db_password
      # Contraseña común de las cuentas de demostración (se crean una sola vez al arrancar).
      DEMO_PASSWORD_FILE: /run/secrets/demo_password
      RISK_BASE_URL: http://risk-engine:8000
      # v4: el portal de monitoreo consulta Prometheus por la red interna telemetry (nunca localhost).
      PROMETHEUS_URL: http://prometheus:9090
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError'
    secrets: [db_password, demo_password]
    depends_on:
      db:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    networks: [edge, data, compute, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', http://127.0.0.1:9090/actuator/health/readiness]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 40s

  # 4. Pull de métricas; no forma parte del núcleo ni del camino del pedido.
  prometheus:
    <<: *runtime
    image: hexaorders/prometheus:1.0.0
    build:
      context: .
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.7
        # Imagen de configuración: la configuración queda dentro de la imagen para que el
        # contenedor funcione con read_only: true (Compose no puede inyectar configs.content
        # en servicios de solo lectura). generate_delivery.py la incorpora inline.
        FROM prom/prometheus:v3.5.1
        COPY <<'HEXFILE_0' /etc/prometheus/prometheus.yml
        global:
          scrape_interval: 10s
          evaluation_interval: 10s
          external_labels:
            project: hexaorders
        rule_files:
          - /etc/prometheus/alerts.yml
        scrape_configs:
          - job_name: order-api
            metrics_path: /actuator/prometheus
            static_configs:
              - targets: [order-api:9090]
          - job_name: risk-engine
            metrics_path: /metrics
            static_configs:
              - targets: [risk-engine:8000]
          - job_name: prometheus
            static_configs:
              - targets: [localhost:9090]
        HEXFILE_0
        COPY <<'HEXFILE_1' /etc/prometheus/alerts.yml
        groups:
          - name: hexaorders
            rules:
              - alert: HexaOrdersServiceDown
                expr: up{job=~"order-api|risk-engine"} == 0
                for: 30s
                labels:
                  severity: critical
                annotations:
                  summary: 'Servicio {{ $$labels.job }} sin respuesta'
                  description: 'Prometheus no puede recopilar métricas durante al menos 30 segundos.'
              - alert: RiskRequestsFailing
                expr: increase(orders_risk_failures_total[2m]) > 0
                for: 10s
                labels:
                  severity: warning
                annotations:
                  summary: 'Falló una evaluación de riesgo'
                  description: 'Revisar risk-engine y los tiempos de espera HTTP de order-api.'
        
        
          # Compatibilidad (v3). Defecto previo corregido: el cliente Java de Prometheus 1.x (Spring Boot 3.5)
          # reserva el sufijo _created y exporta el contador Micrometer "orders_created" como orders_total.
          # Esta regla republica la serie con su nombre original para que los paneles y consultas existentes
          # (orders_created_total) muestren datos sin modificarlos.
          - name: hexaorders-compat
            rules:
              - record: orders_created_total
                expr: orders_total
        
          # Alertas añadidas en la versión 3 (las dos alertas originales de arriba no se modifican).
          - name: hexaorders-platform
            rules:
              - alert: RiskEngineDown
                expr: up{job="risk-engine"} == 0
                for: 30s
                labels:
                  severity: critical
                annotations:
                  summary: 'Motor de riesgo no disponible'
                  description: 'Los checkouts y pedidos nuevos responden 503 hasta que vuelva risk-engine.'
              - alert: HexaOrdersHighErrorRate
                expr: sum(rate(http_server_requests_seconds_count{job="order-api",status=~"5.."}[2m])) > 0.05
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: 'Aumento de errores HTTP 5xx en order-api'
                  description: 'Más de 0,05 respuestas 5xx por segundo durante 2 minutos.'
              - alert: HexaOrdersHighLatency
                expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="order-api",uri=~"/api/.*"}[5m]))) > 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'Latencia p95 de la API superior a 1 s'
                  description: 'Revisar PostgreSQL, el motor de riesgo y los recursos de order-api.'
              - alert: HexaOrdersCheckoutFailures
                expr: sum(increase(hexaorders_checkout_failures_total{reason="risk_unavailable"}[5m])) > 3
                for: 1m
                labels:
                  severity: warning
                annotations:
                  summary: 'Fallos recurrentes de integración Java-Python en el checkout'
                  description: 'Más de 3 checkouts rechazados por indisponibilidad del motor de riesgo en 5 minutos.'
              - alert: HexaOrdersPendingReviewGrowing
                expr: hexaorders_orders_by_status{status="RISK_REVIEW"} > 10
                for: 10m
                labels:
                  severity: info
                annotations:
                  summary: 'Pedidos pendientes de revisión acumulándose'
                  description: 'Más de 10 pedidos en RISK_REVIEW durante 10 minutos: asignar operadores.'
              - alert: HexaOrdersAuthFailuresSpike
                expr: sum(increase(hexaorders_auth_logins_total{outcome="failure"}[5m])) > 10
                for: 1m
                labels:
                  severity: warning
                annotations:
                  summary: 'Muchos inicios de sesión fallidos'
                  description: 'Más de 10 credenciales incorrectas en 5 minutos: posible ataque de fuerza bruta.'
              - alert: HexaOrdersLowStock
                expr: hexaorders_products_low_stock > 0
                for: 15m
                labels:
                  severity: info
                annotations:
                  summary: 'Productos con stock bajo'
                  description: 'Hay productos activos con 5 unidades o menos.'
        HEXFILE_1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --no-web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9091:9090'
    networks: [edge, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 6

  # 5. Datasource y dashboard provisionados: cero configuración manual en la demo.
