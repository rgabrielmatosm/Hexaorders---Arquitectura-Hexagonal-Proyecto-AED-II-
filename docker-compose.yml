            padding: 12px 16px 16px; background: rgba(11, 15, 20, 0.98); border-bottom: 1px solid var(--line); overflow: visible; }
          .site .topbar.is-open .nav { display: flex; }
          .site .nav a { padding: 10px 12px; }
          .site .nav__group { flex-direction: column; border-left: 0; padding: 8px 0 0; margin: 6px 0 0; border-top: 1px solid var(--line); }
          .nav-toggle { display: inline-flex; }
          .hide-sm { display: none; }
          .page-shell--sidebar { grid-template-columns: minmax(0, 1fr); gap: 0; }
          .side-nav { position: static; margin-top: 16px; padding: 8px; min-width: 0; }
          .side-nav__title { display: none; }
          .side-nav ul { display: flex; overflow-x: auto; gap: 6px; scrollbar-width: none; }
          .side-nav ul::-webkit-scrollbar { display: none; }
          .side-nav a { white-space: nowrap; }
          .contact-layout { grid-template-columns: 1fr; }
          .lifecycle-map__row { grid-template-columns: 1fr; }
        }
        @media (max-width: 520px) {
          .page-shell { padding: 0 16px; }
          .page-main { padding: 0 0 48px; }
          .site-footer { padding: 28px 16px 24px; }
          .site-footer__grid { grid-template-columns: 1fr; }
          .hero--home { padding-top: 36px; }
          .hero-visual { display: none; }
          .user-chip__name { display: none; }
          .cta-band { padding: 20px; }
        }
        
        /* ---- Movimiento reducido ---------------------------------------------------------------- */
        @media (prefers-reduced-motion: reduce) {
          body.site .view-root > * { animation: none; }
          .role-card, .side-nav a, .dash-links a { transition: none; }
          a.role-card:hover { transform: none; }
        }
