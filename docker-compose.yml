    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    secrets: [grafana_password]
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks: [edge, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

# IPs variables; descubrimiento por nombre de servicio, nunca localhost entre servicios.
networks:
  edge: {}
  data:
    internal: true
  compute:
    internal: true
  telemetry:
    internal: true

# `down` conserva estos volúmenes; `down -v` elimina los datos.
volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}

# Los valores se generan al desplegar en ./secrets/ (junto a este archivo), nunca se
# incrustan en el entregable ni en Git. Se usan archivos y no `environment:` porque
# Compose solo puede montar secretos de archivo en servicios read_only (bind mount de
# solo lectura). No equivale al almacén cifrado de secretos de Swarm.
secrets:
  db_password:
    file: ./secrets/db_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  demo_password:
    file: ./secrets/demo_password.txt
