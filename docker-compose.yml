        .order-card__top, .order-card__foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tracker { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
        .tracker li { position: relative; display: grid; grid-template-columns: 22px 1fr; column-gap: 12px; padding-bottom: 18px; color: var(--text-2); }
        .tracker li strong, .tracker li small { grid-column: 2; }
        .tracker li::after { content: ''; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
        .tracker li:last-child::after { display: none; }
