                      <tr><th scope="col">Cliente / ID</th><th scope="col">Importe</th><th scope="col">Riesgo</th><th scope="col">Decisión</th><th scope="col">Creado</th></tr>
                    </thead>
                    <tbody id="orders-body">
                      <tr><td colspan="5" class="table__empty">Cargando pedidos…</td></tr>
                    </tbody>
                  </table>
                </div>
              </article>
            </div>
          </section>
        
          <!-- ARQUITECTURA -->
          <section id="arquitectura" class="section" aria-labelledby="arch-title">
            <div class="section__head">
              <div>
                <p class="eyebrow">Architecture Explorer</p>
                <h2 id="arch-title">Explorador de la arquitectura hexagonal</h2>
                <p class="section__lead">Cada bloque es una clase o módulo real del repositorio. Selecciónalo para ver su responsabilidad, capa y archivo.</p>
              </div>
              <div class="segmented" role="group" aria-label="Vista del diagrama">
                <button type="button" class="segmented__btn is-active" data-arch-mode="dependencies" aria-pressed="true">Dependencias del código</button>
                <button type="button" class="segmented__btn" data-arch-mode="execution" aria-pressed="false">Flujo de ejecución</button>
              </div>
            </div>
        
            <p class="arch-legend" id="arch-mode-help"></p>
        
            <div class="arch">
              <div class="arch__diagram card" id="arch-diagram">
                <svg class="arch__edges" id="arch-edges" aria-hidden="true"></svg>
                <div class="arch__col" data-col="actors"><h4>Actor / externo</h4></div>
                <div class="arch__col" data-col="in"><h4>Adaptadores de entrada</h4></div>
                <div class="arch__col arch__col--core" data-col="core"><h4>Núcleo: aplicación + dominio</h4></div>
                <div class="arch__col" data-col="out"><h4>Adaptadores de salida</h4></div>
                <div class="arch__col" data-col="external"><h4>Servicios externos</h4></div>
              </div>
        
              <aside class="arch__detail card" id="arch-detail" aria-live="polite">
                <p class="muted">Selecciona un componente del diagrama.</p>
              </aside>
            </div>
        
            <div class="arch-run card">
              <div class="arch-run__head">
                <div>
                  <h3 class="card__title">Solicitud real a través de la arquitectura</h3>
                  <p class="muted small">Envía un pedido real. Los datos de la derecha (estado HTTP, latencia medida en el navegador, respuesta y lectura posterior desde PostgreSQL) son observaciones auténticas. Los pasos numerados son el <strong>recorrido conceptual</strong> del código para ese resultado: no es una traza instrumentada.</p>
                </div>
                <div class="arch-run__controls">
                  <label class="sr-only" for="run-amount">Importe</label>
                  <select id="run-amount">
                    <option value="125.50">125.50 USD → aprobado</option>
                    <option value="1500.00">1500.00 USD → revisión</option>
                    <option value="0">0 USD → validación (400)</option>
                  </select>
                  <button type="button" class="btn btn--primary" id="run-request">Ejecutar solicitud real</button>
                </div>
              </div>
              <div class="arch-run__body">
                <ol class="steps" id="run-steps"></ol>
                <div class="evidence" id="run-evidence">
                  <p class="muted small">Aún no se ha ejecutado ninguna solicitud.</p>
                </div>
              </div>
            </div>
          </section>
        
          <!-- OBSERVABILIDAD -->
          <section id="observabilidad" class="section" aria-labelledby="obs-title">
            <div class="section__head">
              <div>
                <p class="eyebrow">Observability</p>
                <h2 id="obs-title">Observabilidad</h2>
                <p class="section__lead">Estado consultado en vivo. El estado de salud de una aplicación no implica que todas sus dependencias funcionen: cada fila indica de dónde procede el dato.</p>
              </div>
              <div class="obs-links">
                <a class="btn btn--ghost btn--sm" id="link-grafana" target="_blank" rel="noopener">Grafana ↗</a>
                <a class="btn btn--ghost btn--sm" id="link-prometheus" target="_blank" rel="noopener">Prometheus ↗</a>
