        <!doctype html>
        <html lang="es">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="description" content="HexaOrders — Order Management & Risk Assessment System. Arquitectura hexagonal con Java, Python, PostgreSQL, Prometheus y Grafana.">
          <meta name="theme-color" content="#0B0F14">
          <title>HexaOrders · Order Management &amp; Risk Assessment</title>
          <link rel="icon" href="img/logo.svg" type="image/svg+xml">
          <link rel="stylesheet" href="css/base.css">
          <link rel="stylesheet" href="css/components.css">
          <link rel="stylesheet" href="css/effects.css">
          <link rel="stylesheet" href="css/platform.css">
          <script type="module" src="js/app.js"></script>
        </head>
        <body data-mode="lab">
        <canvas id="grid-canvas" class="grid-canvas" aria-hidden="true"></canvas>
        
        <!-- Bienvenida: no bloquea; el estado mostrado proviene de consultas reales. -->
        <div id="splash" class="splash" role="dialog" aria-modal="false" aria-labelledby="splash-title">
          <div class="splash__inner">
            <img class="splash__logo" src="img/logo.svg" alt="" width="96" height="96">
            <h1 id="splash-title" class="splash__title">HEXAORDERS</h1>
            <p class="splash__subtitle">Order Management &amp; Risk Assessment System</p>
            <ul class="splash__checks" aria-live="polite">
              <li data-check="api"><span class="dot dot--pending"></span>API Java y PostgreSQL <em>comprobando…</em></li>
              <li data-check="prometheus"><span class="dot dot--pending"></span>Prometheus <em>comprobando…</em></li>
            </ul>
            <button type="button" id="splash-enter" class="btn btn--primary">Entrar <kbd>Enter</kbd></button>
          </div>
        </div>
        
        <a class="skip-link" href="#main">Saltar al contenido</a>
        
        <header class="topbar">
          <a class="brand" href="#inicio" aria-label="HexaOrders, inicio">
            <img src="img/logo.svg" alt="" width="34" height="34">
            <span class="brand__name">HEXA<span>ORDERS</span></span>
          </a>
          <nav class="nav" aria-label="Secciones">
            <a href="#/tienda" data-route-link="/tienda">Tienda</a>
            <a href="#inicio" data-lab-link>Laboratorio</a>
            <a href="#panel" data-nav>Panel</a>
            <a href="#pedidos" data-nav>Pedidos</a>
            <a href="#arquitectura" data-nav>Arquitectura</a>
            <a href="#observabilidad" data-nav>Observabilidad</a>
            <span class="nav__group" id="role-nav" aria-label="Áreas de tu rol"></span>
          </nav>
          <div class="topbar__actions">
            <div id="api-status" class="status-pill" role="status" aria-live="polite">
              <span class="dot dot--pending"></span><span class="status-pill__text">Conectando…</span>
            </div>
            <a class="icon-btn" href="#/carrito" id="cart-button" aria-label="Carrito">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H7 M10 20h.01 M18 20h.01"/></svg>
              <span class="icon-btn__badge" id="cart-count" hidden>0</span>
            </a>
            <div class="menu" id="account"></div>
          </div>
        </header>
        
        <main id="main" data-view="lab">
          <!-- INICIO -->
          <section id="inicio" class="hero">
            <p class="eyebrow">Order Management &amp; Risk Assessment System</p>
            <h1 class="hero__title">Pedidos evaluados con <span class="gradient-text">arquitectura hexagonal</span>.</h1>
            <p class="hero__lead">Cada pedido entra por un adaptador REST en <strong>Java 21</strong>, consulta el motor de riesgo en <strong>Python</strong> a través de un puerto, aplica las reglas del dominio y se guarda en <strong>PostgreSQL</strong>. Prometheus y Grafana observan el sistema completo.</p>
            <div class="hero__actions">
              <a class="btn btn--primary" href="#pedidos">Crear un pedido</a>
              <a class="btn btn--ghost" href="#arquitectura">Explorar la arquitectura</a>
              <a class="btn btn--ghost" href="#/tienda">Visitar la tienda</a>
            </div>
            <ul class="tech-list" aria-label="Tecnologías">
              <li>Java 21 · Spring Boot</li><li>Python · FastAPI</li><li>PostgreSQL 17</li>
              <li>Docker Compose</li><li>Prometheus</li><li>Grafana</li><li>Kubernetes</li>
            </ul>
          </section>
        
          <!-- PANEL -->
          <section id="panel" class="section" aria-labelledby="panel-title">
            <div class="section__head">
              <div>
                <p class="eyebrow">Dashboard</p>
                <h2 id="panel-title">Panel de pedidos</h2>
                <p class="section__lead">Datos reales de PostgreSQL obtenidos con <code>GET /api/orders/statistics</code> y <code>GET /api/orders</code>.</p>
              </div>
              <button type="button" class="btn btn--ghost btn--sm" data-refresh>Actualizar <span aria-hidden="true">↻</span></button>
            </div>
        
            <div class="stats">
              <article class="stat card">
                <span class="stat__label">Total de pedidos</span>
                <strong class="stat__value" id="stat-total" data-loading>—</strong>
                <span class="stat__hint">Todos los pedidos persistidos</span>
              </article>
              <article class="stat card stat--success">
                <span class="stat__label">Aprobados</span>
                <strong class="stat__value" id="stat-approved" data-loading>—</strong>
                <span class="stat__hint">Puntaje de riesgo &lt; 70</span>
              </article>
              <article class="stat card stat--warning">
                <span class="stat__label">En revisión</span>
                <strong class="stat__value" id="stat-review" data-loading>—</strong>
                <span class="stat__hint">Puntaje de riesgo ≥ 70</span>
              </article>
              <article class="stat card stat--accent">
                <span class="stat__label">Tasa de revisión</span>
                <strong class="stat__value" id="stat-rate" data-loading>—</strong>
                <span class="stat__hint">En revisión ÷ total</span>
              </article>
            </div>
        
            <div class="panel-grid">
              <article class="card">
                <h3 class="card__title">Distribución por decisión</h3>
                <div class="distribution" id="distribution" role="img" aria-label="Distribución de pedidos por decisión">
                  <span class="distribution__bar distribution__bar--approved"></span>
                  <span class="distribution__bar distribution__bar--review"></span>
                </div>
                <ul class="legend">
                  <li><span class="dot dot--ok"></span>Aprobados <strong id="legend-approved">—</strong></li>
                  <li><span class="dot dot--warn"></span>En revisión <strong id="legend-review">—</strong></li>
                </ul>
                <h3 class="card__title card__title--spaced">Reglas del motor de riesgo</h3>
                <p class="muted small">Política determinista implementada en <code>risk_engine/domain/risk.py</code>. La decisión final la toma el dominio Java en <code>OrderStatus.fromRiskScore</code> (puntaje ≥ 70 → revisión).</p>
                <table class="rules">
                  <thead><tr><th scope="col">Importe (USD)</th><th scope="col">Puntaje</th><th scope="col">Decisión</th></tr></thead>
                  <tbody>
                    <tr><td>&lt; 500</td><td class="mono">10</td><td><span class="badge badge--ok">APROBADO</span></td></tr>
                    <tr><td>500 – 999.99</td><td class="mono">40</td><td><span class="badge badge--ok">APROBADO</span></td></tr>
                    <tr><td>≥ 1000</td><td class="mono">75</td><td><span class="badge badge--warn">REVISIÓN</span></td></tr>
                  </tbody>
                </table>
              </article>
              <article class="card">
                <div class="card__head">
                  <h3 class="card__title">Últimos pedidos registrados</h3>
                  <a class="link" href="#pedidos">Ver todos →</a>
                </div>
                <ul class="recent" id="recent-orders" aria-live="polite">
                  <li class="recent__empty">Cargando pedidos…</li>
                </ul>
              </article>
            </div>
          </section>
        
          <!-- PEDIDOS -->
          <section id="pedidos" class="section" aria-labelledby="orders-title">
            <div class="section__head">
              <div>
                <p class="eyebrow">Order Management</p>
                <h2 id="orders-title">Gestión de pedidos</h2>
                <p class="section__lead">Las validaciones del formulario solo ayudan al usuario: el dominio Java vuelve a validar todo y es la autoridad.</p>
              </div>
            </div>
        
            <div class="orders-grid">
              <div class="orders-grid__side">
                <form id="order-form" class="card form" novalidate>
                  <h3 class="card__title">Nuevo pedido</h3>
                  <div class="field">
                    <label for="customer">Identificador del cliente</label>
                    <input id="customer" name="customerId" value="cliente_demo" required maxlength="64" autocomplete="off" spellcheck="false" aria-describedby="customer-help customer-error">
                    <small id="customer-help" class="field__help">1 a 64 caracteres: letras, dígitos, guion o guion bajo.</small>
                    <small id="customer-error" class="field__error" hidden></small>
                  </div>
                  <div class="field">
                    <label for="amount">Importe en USD</label>
                    <input id="amount" name="amount" inputmode="decimal" value="125.50" required autocomplete="off" aria-describedby="amount-help amount-error">
                    <small id="amount-help" class="field__help">Mayor que 0 y hasta 1 000 000.00, con 2 decimales como máximo.</small>
                    <small id="amount-error" class="field__error" hidden></small>
                  </div>
                  <div class="presets" role="group" aria-label="Importes de ejemplo">
                    <button type="button" class="chip" data-amount="125.50">125.50 · riesgo 10</button>
                    <button type="button" class="chip" data-amount="750.00">750.00 · riesgo 40</button>
                    <button type="button" class="chip" data-amount="1500.00">1500.00 · riesgo 75</button>
                  </div>
                  <button type="submit" class="btn btn--primary btn--block" id="order-submit">Evaluar riesgo y crear pedido</button>
                  <div id="order-result" class="result" hidden aria-live="polite"></div>
