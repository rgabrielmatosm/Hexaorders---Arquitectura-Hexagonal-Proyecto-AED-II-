        <body>
        <main>
          <header><div class="brand">⬡ Hexa<span>Orders</span></div><div class="connection" id="connection" role="status">Conectando con la API…</div></header>
          <section class="intro"><div class="eyebrow">Laboratorio de arquitectura hexagonal</div><h1>Cada pedido.<br>Una decisión con criterio.</h1><p>Crea un pedido y observa cómo Java consulta el motor de riesgo en Python, aplica las reglas del negocio y guarda el resultado en PostgreSQL.</p><div class="flow" aria-label="Flujo de un pedido"><span>01 · REST / Java</span>→<span>02 · Riesgo / Python</span>→<span>03 · Dominio</span>→<span>04 · PostgreSQL</span></div></section>
          <div class="workspace">
            <section class="card"><h2>Nuevo pedido</h2><form id="order-form"><label for="customer">Identificador del cliente</label><input id="customer" name="customerId" value="cliente_demo" required maxlength="64" pattern="[A-Za-z0-9_-]{1,64}" autocomplete="off"><label for="amount">Importe en USD</label><input id="amount" name="amount" type="number" value="125.50" min="0.01" max="1000000" step="0.01" required><div class="samples"><button type="button" data-amount="25.00">USD 25</button><button type="button" data-amount="95000.00">USD 95 000</button></div><button id="submit" class="submit" type="submit">Evaluar y crear pedido ↗</button><p class="small">Un puntaje desde 70 requiere revisión. Los importes se procesan con precisión decimal y nunca se redondean.</p></form><div id="notice" class="notice" role="status" hidden></div><details><summary>Ver última respuesta de la API</summary><pre id="response">Todavía no hay una respuesta.</pre></details></section>
            <section class="card"><div class="table-top"><h2>Últimos pedidos</h2><button type="button" id="refresh" class="refresh">Actualizar ↻</button></div><p class="small" id="count">Se muestran hasta 50 pedidos, del más reciente al más antiguo.</p><div class="scroll"><table><thead><tr><th>Cliente / pedido</th><th>Importe</th><th>Riesgo</th><th>Decisión</th></tr></thead><tbody id="orders"><tr><td colspan="4" class="empty">Cargando pedidos…</td></tr></tbody></table></div></section>
          </div>
          <footer><span>Java 21 · Python · PostgreSQL · Docker Compose</span><span>Reglas independientes de frameworks. Dependencias hacia el dominio.</span></footer>
        </main>
        <script>
          const byId = id => document.getElementById(id);
          const money = new Intl.NumberFormat('es-PE', {style:'currency',currency:'USD'});
          const appendCell = (row, value, className) => { const cell = document.createElement('td'); cell.textContent = value; if(className) cell.className = className; row.appendChild(cell); return cell; };
          async function readResponse(response){ let body;try{body=await response.json();}catch{throw new Error('La API devolvió una respuesta no válida.');} if(!response.ok) throw new Error(body.detail || 'No se pudo completar la operación.');return body; }
          async function loadOrders(){
            try{
              const orders=await readResponse(await fetch('/api/orders',{cache:'no-store'}));
              byId('orders').replaceChildren();
              for(const order of orders){
                const row=document.createElement('tr'); const client=appendCell(row,order.customerId); const id=document.createElement('span');id.className='id';id.textContent=order.id;client.appendChild(id);
                appendCell(row,money.format(order.amount));appendCell(row,order.riskScore+' / 100','score');
                const statusCell=appendCell(row,'');const pill=document.createElement('span');pill.className='pill'+(order.status==='REVIEW'?' review':'');pill.textContent=order.status==='REVIEW'?'REVISIÓN':'APROBADO';statusCell.appendChild(pill);byId('orders').appendChild(row);
              }
              if(!orders.length){const row=document.createElement('tr');const cell=appendCell(row,'Tu primer pedido empieza aquí.','empty');cell.colSpan=4;byId('orders').appendChild(row);}
              byId('connection').textContent='● API conectada';byId('count').textContent=orders.length+' pedidos visibles · máximo 50 · datos persistidos';
            }catch(error){byId('connection').textContent='● API no disponible';const row=document.createElement('tr');const cell=appendCell(row,error.message,'empty');cell.colSpan=4;byId('orders').replaceChildren(row);}
          }
          byId('order-form').addEventListener('submit',async event=>{
            event.preventDefault();const button=byId('submit');button.disabled=true;button.textContent='Evaluando riesgo…';byId('notice').hidden=true;
            try{
              const body=await readResponse(await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:byId('customer').value,amount:Number(byId('amount').value),currency:'USD'})}));
              byId('response').textContent=JSON.stringify(body,null,2);byId('notice').className='notice success';byId('notice').textContent='Pedido creado · '+(body.status==='REVIEW'?'requiere revisión':'aprobado')+' · riesgo '+body.riskScore+'/100';await loadOrders();
            }catch(error){byId('notice').className='notice error';byId('notice').textContent=error.message;byId('response').textContent=error.message;}
            finally{byId('notice').hidden=false;button.disabled=false;button.textContent='Evaluar y crear pedido ↗';}
          });
          document.querySelectorAll('[data-amount]').forEach(button=>button.addEventListener('click',()=>byId('amount').value=button.dataset.amount));
          byId('refresh').addEventListener('click',loadOrders);loadOrders();
        </script>
        </body>
        </html>
