                when(risk.assess(draft)).thenReturn(101);
                assertThatThrownBy(() -> service.create(draft)).isInstanceOf(RiskUnavailableException.class);
                verifyNoInteractions(repository);
                verify(telemetry).riskFailure();
            }
        
