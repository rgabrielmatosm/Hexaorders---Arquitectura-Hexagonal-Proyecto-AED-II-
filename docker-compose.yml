                  <div class="segmented" role="group" aria-label="Filtrar por decisión">
                    <button type="button" class="segmented__btn is-active" data-filter="ALL" aria-pressed="true">Todos</button>
                    <button type="button" class="segmented__btn" data-filter="APPROVED" aria-pressed="false">Aprobados</button>
                    <button type="button" class="segmented__btn" data-filter="REVIEW" aria-pressed="false">Revisión</button>
                  </div>
                </div>
