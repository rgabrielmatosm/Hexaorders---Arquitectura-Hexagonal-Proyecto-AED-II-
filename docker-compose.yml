            customer_id VARCHAR(64) NOT NULL CHECK (customer_id ~ '^[A-Za-z0-9_-]{1,64}$$'),
            amount NUMERIC(12, 2) NOT NULL CHECK (amount > 0 AND amount <= 1000000.00),
