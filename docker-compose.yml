          transition: color 0.2s, background 0.2s;
        }
        .nav a:hover { color: var(--text); background: rgba(148, 163, 184, 0.08); }
        .nav a.is-active { color: var(--text); background: var(--violet-soft); }
        
        .section { padding: 72px 0 8px; }
        .section__head {
          display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
          margin-bottom: 28px; flex-wrap: wrap;
        }
        .section__lead { color: var(--text-2); margin-top: 8px; max-width: 720px; }
        
        .eyebrow {
          color: var(--violet-2); font-size: 0.74rem; font-weight: 700;
          letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px;
        }
        
        .hero { padding: 96px 0 40px; max-width: 900px; }
        .hero__title { font-size: clamp(2.3rem, 6vw, 4.2rem); letter-spacing: -0.035em; line-height: 1.05; }
        .hero__lead { color: var(--text-2); font-size: 1.08rem; margin-top: 22px; max-width: 720px; }
        .hero__lead strong { color: var(--text); font-weight: 600; }
        .hero__actions { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
        
        .gradient-text {
          background: linear-gradient(100deg, var(--violet-2), var(--violet) 55%, #C4B5FD);
          -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        
        .tech-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 34px 0 0; }
        .tech-list li {
          font-size: 0.8rem; color: var(--text-2);
          border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
          background: rgba(21, 27, 35, 0.7);
        }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
        .orders-grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
        .orders-grid__side { display: grid; gap: 16px; }
        .obs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        
        .footer {
          position: relative; z-index: 1;
          max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px;
          border-top: 1px solid var(--line);
          display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center;
        }
        .footer__brand { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
        .footer__brand strong { color: var(--text); }
        
        /* Responsive */
        @media (max-width: 1080px) {
          .stats { grid-template-columns: repeat(2, 1fr); }
          .orders-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 860px) {
          :root { --topbar-h: 104px; }
          .topbar { flex-wrap: wrap; height: auto; min-height: var(--topbar-h); justify-content: space-between; gap: 6px 12px; padding-top: 10px; padding-bottom: 8px; }
          .nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
          .nav::-webkit-scrollbar { display: none; }
          .nav a { white-space: nowrap; }
          .panel-grid, .obs-grid { grid-template-columns: 1fr; }
          .hero { padding-top: 64px; }
          .section { padding-top: 56px; }
        }
        
        @media (max-width: 520px) {
          main { padding: 0 16px 48px; }
          .topbar { padding: 0 16px; }
          .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
          .footer { padding: 24px 16px 32px; }
        }
        base.css
        /* HexaOrders — componentes reutilizables. */
        
        /* Tarjetas */
        .card {
          position: relative;
          background: linear-gradient(180deg, rgba(28, 36, 48, 0.78), rgba(21, 27, 35, 0.86));
          border: 1px solid var(--line);
          border-radius: var(--radius);
          padding: 22px;
          box-shadow: var(--shadow);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
        }
        .card__head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
        .card__title { font-size: 1rem; font-weight: 650; margin-bottom: 14px; }
        .card__head .card__title { margin-bottom: 0; }
        .card__title--spaced { margin-top: 26px; }
        
        /* Botones */
        .btn {
          display: inline-flex; align-items: center; justify-content: center; gap: 8px;
          font: inherit; font-weight: 600; font-size: 0.92rem;
          padding: 11px 18px; border-radius: 10px; border: 1px solid transparent;
          cursor: pointer; color: var(--text);
          transition: transform 0.15s var(--ease), background 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn:active { transform: translateY(1px) scale(0.99); }
        .btn:disabled { opacity: 0.55; cursor: progress; }
        .btn--primary {
          background: linear-gradient(135deg, var(--violet), #7C3AED);
          box-shadow: 0 6px 24px rgba(139, 92, 246, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .btn--primary:hover { box-shadow: 0 8px 30px rgba(139, 92, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2); color: #fff; }
        .btn--ghost { background: rgba(148, 163, 184, 0.06); border-color: var(--line-strong); color: var(--text); }
        .btn--ghost:hover { border-color: var(--violet-2); background: var(--violet-soft); color: var(--text); }
        .btn--sm { padding: 7px 12px; font-size: 0.82rem; border-radius: 8px; }
        .btn--block { width: 100%; }
        .btn kbd { font-size: 0.72rem; color: rgba(248, 250, 252, 0.75); border-color: rgba(248, 250, 252, 0.3); }
        
        .chip {
          font: inherit; font-size: 0.78rem; cursor: pointer;
          padding: 6px 10px; border-radius: 999px;
          border: 1px solid var(--line-strong); background: transparent; color: var(--text-2);
          transition: border-color 0.2s, color 0.2s, background 0.2s;
        }
        .chip:hover { border-color: var(--violet-2); color: var(--text); background: var(--violet-soft); }
        
        .link { font-size: 0.85rem; }
        
        /* Indicadores */
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-2); }
        .dot--ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
        .dot--warn { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
        .dot--error { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
        .dot--pending { background: var(--violet-2); box-shadow: 0 0 0 3px var(--violet-soft); }
        
        .status-pill {
          display: flex; align-items: center; gap: 8px;
          font-size: 0.8rem; color: var(--text-2);
          border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
          background: rgba(21, 27, 35, 0.8); white-space: nowrap;
        }
        
        .badge {
          display: inline-block; font-size: 0.7rem; font-weight: 750; letter-spacing: 0.06em;
          padding: 3px 8px; border-radius: 6px;
        }
        .badge--ok { color: var(--green); background: var(--green-soft); }
        .badge--warn { color: var(--amber); background: var(--amber-soft); }
        .badge--error { color: var(--red); background: var(--red-soft); }
        .badge--neutral { color: var(--text-2); background: rgba(148, 163, 184, 0.12); }
        
        /* Estadísticas */
        .stat { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
        .stat::after {
          content: ""; position: absolute; inset: auto -40% -60% auto; width: 160px; height: 160px; border-radius: 50%;
          background: radial-gradient(circle, rgba(139, 92, 246, 0.18), transparent 70%); pointer-events: none;
        }
        .stat--success::after { background: radial-gradient(circle, rgba(16, 185, 129, 0.18), transparent 70%); }
        .stat--warning::after { background: radial-gradient(circle, rgba(245, 158, 11, 0.18), transparent 70%); }
        .stat__label { color: var(--text-2); font-size: 0.82rem; }
        .stat__value { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
        .stat--success .stat__value { color: var(--green); }
        .stat--warning .stat__value { color: var(--amber); }
        .stat--accent .stat__value { color: var(--violet-2); }
        .stat__hint { color: var(--text-2); font-size: 0.75rem; }
        
        .distribution {
          display: flex; height: 14px; border-radius: 999px; overflow: hidden;
          background: rgba(148, 163, 184, 0.1); margin: 6px 0 14px;
        }
        .distribution__bar { height: 100%; transition: width 0.8s var(--ease); }
        .distribution__bar--approved { background: linear-gradient(90deg, #059669, var(--green)); }
        .distribution__bar--review { background: linear-gradient(90deg, #D97706, var(--amber)); }
        
        .legend { list-style: none; padding: 0; margin: 0; display: flex; gap: 22px; color: var(--text-2); font-size: 0.85rem; }
        .legend li { display: flex; align-items: center; gap: 8px; }
        .legend strong { color: var(--text); font-variant-numeric: tabular-nums; }
        
        .rules { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
        .rules th { text-align: left; color: var(--text-2); font-weight: 500; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .rules th, .rules td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); }
        
        .recent { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
        .recent li {
          display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
          padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
          background: rgba(11, 15, 20, 0.45); font-size: 0.88rem;
        }
        .recent__customer { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recent__meta { display: block; color: var(--text-2); font-size: 0.74rem; font-weight: 400; }
        .recent__amount { font-variant-numeric: tabular-nums; }
        .recent .recent__empty { display: block; color: var(--text-2); text-align: center; padding: 26px; }
        
        /* Formularios */
        .form { display: grid; gap: 4px; }
        .field { display: grid; gap: 6px; margin-bottom: 12px; }
        .field label { font-size: 0.82rem; color: var(--text-2); }
        input, select {
          width: 100%; font: inherit; color: var(--text);
          background: rgba(11, 15, 20, 0.75); border: 1px solid var(--line-strong);
          border-radius: 10px; padding: 11px 13px;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: rgba(148, 163, 184, 0.6); }
        input:focus, select:focus { outline: none; border-color: var(--violet-2); box-shadow: 0 0 0 3px var(--violet-soft); }
        input[aria-invalid="true"] { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
        .field__help { color: var(--text-2); font-size: 0.74rem; }
        .field__error { color: var(--red); font-size: 0.78rem; }
        .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 16px; }
        
        .result {
          margin-top: 14px; padding: 13px 14px; border-radius: var(--radius-sm);
          border: 1px solid var(--line); font-size: 0.86rem; overflow-wrap: anywhere;
          background: rgba(11, 15, 20, 0.55);
        }
        .result--ok { border-color: rgba(16, 185, 129, 0.45); }
        .result--warn { border-color: rgba(245, 158, 11, 0.45); }
        .result--error { border-color: rgba(239, 68, 68, 0.5); color: #FCA5A5; }
        .result__title { font-weight: 650; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text); }
        .result dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; }
        .result dt { color: var(--text-2); }
        .result dd { margin: 0; font-family: var(--mono); font-size: 0.8rem; }
        
        /* Tabla */
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .toolbar input { flex: 1 1 200px; width: auto; padding: 8px 12px; }
        
        .segmented { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(11, 15, 20, 0.6); }
        .segmented__btn {
          font: inherit; font-size: 0.82rem; color: var(--text-2); background: transparent;
          border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; transition: background 0.2s, color 0.2s;
        }
        .segmented__btn:hover { color: var(--text); }
        .segmented__btn.is-active { background: var(--violet-soft); color: var(--text); box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.35); }
        
        .table-scroll { overflow-x: auto; margin-top: 8px; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.86rem; white-space: nowrap; }
        .table th { text-align: left; color: var(--text-2); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; }
        .table th, .table td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .table tbody tr { transition: background 0.2s; }
        .table tbody tr:hover { background: rgba(139, 92, 246, 0.05); }
        .table__id { display: block; font-family: var(--mono); font-size: 0.7rem; color: var(--text-2); cursor: copy; }
        .table__empty { text-align: center !important; color: var(--text-2); padding: 40px 0 !important; white-space: normal; }
        .score { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.82rem; }
        .score__bar { width: 54px; height: 6px; border-radius: 999px; background: rgba(148, 163, 184, 0.15); overflow: hidden; }
        .score__bar span { display: block; height: 100%; border-radius: inherit; }
        
        /* Explorador de arquitectura */
        .arch-legend { color: var(--text-2); font-size: 0.86rem; margin: -10px 0 16px; min-height: 1.4em; }
        .arch { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
        .arch__diagram {
          display: grid; grid-template-columns: 0.9fr 1fr 1.25fr 1fr 1.05fr; gap: 14px;
          padding: 20px; overflow: hidden;
        }
        .arch__edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
        .arch__col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
        .arch__col h4 { font-size: 0.66rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; min-height: 2.6em; }
        .arch__col--core {
          padding: 12px; margin: -12px 0; border-radius: 16px;
          background: radial-gradient(120% 80% at 50% 40%, rgba(139, 92, 246, 0.12), transparent 70%);
          border: 1px dashed rgba(167, 139, 250, 0.35);
        }
        .arch__group { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: rgba(11, 15, 20, 0.35); }
        .arch__group-title { font-size: 0.66rem; color: var(--violet-2); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 2px; }
        
        .node {
          font: inherit; text-align: left; cursor: pointer; width: 100%;
          padding: 9px 10px; border-radius: 10px;
          border: 1px solid var(--line-strong); background: rgba(21, 27, 35, 0.92); color: var(--text);
          transition: border-color 0.2s, box-shadow 0.25s, background 0.25s, opacity 0.25s, transform 0.2s var(--ease);
        }
        .node:hover { border-color: var(--violet-2); transform: translateY(-1px); }
        .node__name { display: block; font-size: 0.8rem; font-weight: 650; overflow-wrap: break-word; }
        .node__kind { display: block; font-size: 0.66rem; color: var(--text-2); margin-top: 2px; }
        .node[data-kind="domain"] { border-color: rgba(167, 139, 250, 0.5); background: rgba(139, 92, 246, 0.14); }
        .node[data-kind="port"] { border-style: dashed; }
        .node[data-kind="external"] { background: rgba(11, 15, 20, 0.85); }
        .node.is-selected { border-color: var(--violet-2); box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.35), 0 0 24px rgba(139, 92, 246, 0.35); }
        .node.is-related { border-color: rgba(167, 139, 250, 0.8); }
        .node.is-dimmed { opacity: 0.35; }
        .node.is-active { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft), 0 0 26px rgba(16, 185, 129, 0.35); }
        .node.is-failed { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
        
        .edge { fill: none; stroke: rgba(148, 163, 184, 0.22); stroke-width: 1.4; }
        .edge--related { stroke: rgba(167, 139, 250, 0.85); stroke-width: 2; }
        .edge--active { stroke: var(--green); stroke-width: 2.4; }
        .edge-label { fill: var(--text-2); font: 600 10px var(--font); }
        
        .arch__detail { position: sticky; top: calc(var(--topbar-h) + 16px); min-height: 280px; }
        .detail__layer { margin-bottom: 8px; }
        .detail__name { font-size: 1.15rem; overflow-wrap: anywhere; }
        .detail__file { display: block; margin: 10px 0 14px; padding: 8px 10px; border-radius: 8px; background: rgba(11, 15, 20, 0.7); color: var(--violet-2); font-family: var(--mono); font-size: 0.74rem; overflow-wrap: anywhere; }
        .detail dl { display: grid; gap: 10px; margin: 0; }
        .detail dt { font-size: 0.7rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; }
        .detail dd { margin: 2px 0 0; font-size: 0.88rem; }
        .detail__relations { margin: 4px 0 0; padding-left: 18px; font-size: 0.84rem; color: var(--text-2); }
        .detail__relations li { margin: 3px 0; }
        
        .arch-run { margin-top: 16px; }
        .arch-run__head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
        .arch-run__head > div:first-child { max-width: 720px; }
        .arch-run__controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .arch-run__controls select { width: auto; }
        .arch-run__body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; margin-top: 18px; }
        
        .steps { list-style: none; counter-reset: step; padding: 0; margin: 0; display: grid; gap: 8px; }
        .steps li {
          counter-increment: step; position: relative;
          padding: 10px 12px 10px 44px; border-radius: 10px; font-size: 0.85rem;
          border: 1px solid var(--line); background: rgba(11, 15, 20, 0.45); color: var(--text-2);
          transition: border-color 0.3s, color 0.3s, background 0.3s;
        }
        .steps li::before {
          content: counter(step); position: absolute; left: 12px; top: 10px;
          width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
          font: 700 0.72rem var(--mono); background: rgba(148, 163, 184, 0.12); color: var(--text-2);
        }
        .steps li.is-done { color: var(--text); border-color: rgba(16, 185, 129, 0.35); }
        .steps li.is-done::before { background: var(--green); color: #052e22; }
        .steps li.is-failed { color: var(--text); border-color: rgba(239, 68, 68, 0.5); }
        .steps li.is-failed::before { background: var(--red); color: #fff; }
        .steps li.is-skipped { opacity: 0.45; text-decoration: line-through; }
        .steps code { font-size: 0.78em; }
        
        .evidence { display: grid; gap: 10px; align-content: start; }
        .evidence pre {
          margin: 0; max-height: 260px; overflow: auto; padding: 12px; border-radius: 10px;
          background: rgba(11, 15, 20, 0.8); border: 1px solid var(--line);
          font: 0.75rem/1.55 var(--mono); color: #C4B5FD; white-space: pre-wrap; word-break: break-word;
        }
        .evidence__row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
        .evidence__row span:first-child { color: var(--text-2); }
        
        /* Observabilidad */
        .obs-links { display: flex; gap: 8px; }
        .alert {
          margin-bottom: 16px; padding: 12px 16px; border-radius: var(--radius-sm);
          border: 1px solid rgba(245, 158, 11, 0.45); background: var(--amber-soft); color: #FCD34D; font-size: 0.88rem;
        }
        .health { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
        .health li {
          display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
          padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(11, 15, 20, 0.45);
        }
        .health__name { font-weight: 600; font-size: 0.9rem; }
        .health__source { display: block; color: var(--text-2); font-size: 0.74rem; font-weight: 400; }
        .metrics { display: grid; grid-template-columns: 1fr auto; gap: 0; margin: 0 0 12px; }
        .metrics dt, .metrics dd { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
        .metrics dt { color: var(--text-2); }
        .metrics dt code { display: block; margin-top: 3px; font-size: 0.68rem; width: fit-content; }
        .metrics dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
        
        /* Toasts */
        .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: grid; gap: 10px; max-width: min(380px, calc(100vw - 36px)); }
        .toast {
          padding: 12px 14px; border-radius: 12px; font-size: 0.88rem;
          background: rgba(21, 27, 35, 0.96); border: 1px solid var(--line-strong); box-shadow: var(--shadow);
          display: flex; gap: 10px; align-items: flex-start;
        }
        .toast--ok { border-color: rgba(16, 185, 129, 0.5); }
        .toast--warn { border-color: rgba(245, 158, 11, 0.5); }
        .toast--error { border-color: rgba(239, 68, 68, 0.55); }
        .toast .dot { margin-top: 7px; }
        
        /* Bienvenida */
        .splash {
          position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
          background: radial-gradient(60% 50% at 50% 45%, rgba(139, 92, 246, 0.16), transparent 70%), rgba(11, 15, 20, 0.94);
          backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .splash[hidden] { display: none; }
        .splash__inner { text-align: center; padding: 24px; display: grid; justify-items: center; gap: 10px; }
        .splash__logo { width: 96px; height: 96px; filter: drop-shadow(0 0 28px rgba(139, 92, 246, 0.55)); }
        .splash__title { font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: 0.32em; font-weight: 800; margin-right: -0.32em; margin-top: 10px; }
        .splash__subtitle { color: var(--text-2); letter-spacing: 0.08em; font-size: 0.92rem; }
        .splash__checks { list-style: none; padding: 0; margin: 22px 0 18px; display: grid; gap: 8px; text-align: left; }
        .splash__checks li { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; color: var(--text-2); }
        .splash__checks em { font-style: normal; color: var(--text); }
        
        /* Responsive de componentes */
        @media (max-width: 1080px) {
          .arch { grid-template-columns: 1fr; }
          .arch__detail { position: static; min-height: 0; }
        }
        @media (max-width: 900px) {
          .arch__diagram { grid-template-columns: 1fr 1fr; }
          .arch__col--core { grid-column: 1 / -1; order: -1; margin: 0; }
          .arch__edges { display: none; }
          .arch-run__body { grid-template-columns: 1fr; }
        }
        @media (max-width: 520px) {
          .card { padding: 16px; }
          .arch__diagram { grid-template-columns: 1fr; padding: 14px; }
          .recent li { grid-template-columns: 1fr auto; }
          .recent li > :nth-child(3) { grid-column: 2; }
          .health li { grid-template-columns: auto 1fr; }
          .health li > :last-child { grid-column: 2; }
          .obs-links { width: 100%; }
        }
        components.css
        /* HexaOrders — cuadrícula interactiva, animaciones y movimiento reducido. */
        
        /* Cuadrícula interactiva: un único <canvas> fijo detrás del contenido. */
        .grid-canvas {
          position: fixed; inset: 0; width: 100vw; height: 100vh;
          z-index: 0; pointer-events: none;
        }
        /* Viñeta para que la cuadrícula no compita con el contenido. */
        body::after {
          content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
          background:
            radial-gradient(70% 55% at 50% 0%, rgba(139, 92, 246, 0.10), transparent 70%),
            radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(11, 15, 20, 0.85) 100%);
        }
        .topbar, .splash, .toasts { z-index: 20; }
        .splash { z-index: 50; }
        .toasts { z-index: 60; }
        
        /* Entrada de la bienvenida */
        @keyframes splash-logo {
          0% { opacity: 0; transform: scale(0.82) rotate(-30deg); }
          60% { opacity: 1; }
          100% { opacity: 1; transform: scale(1) rotate(0); }
        }
        @keyframes fade-up {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: none; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.35; }
        }
        .splash__logo { animation: splash-logo 0.9s var(--ease) both; }
        .splash__title { animation: fade-up 0.7s 0.15s var(--ease) both; }
        .splash__subtitle { animation: fade-up 0.7s 0.3s var(--ease) both; }
        .splash__checks { animation: fade-up 0.7s 0.45s var(--ease) both; }
        #splash-enter { animation: fade-up 0.7s 0.6s var(--ease) both; }
        .splash.is-leaving { opacity: 0; transition: opacity 0.45s var(--ease); pointer-events: none; }
        
        .dot--pending { animation: pulse 1.2s ease-in-out infinite; }
        
        /* Aparición de secciones al hacer scroll */
        .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
        .reveal.is-visible { opacity: 1; transform: none; }
        
        /* Valor que cambia en una estadística */
        @keyframes value-flash {
          from { text-shadow: 0 0 18px rgba(167, 139, 250, 0.9); }
          to { text-shadow: none; }
        }
        .stat__value.is-updated { animation: value-flash 1.2s var(--ease); }
        
        /* Esqueleto de carga */
        [data-loading] { color: transparent !important; position: relative; }
        [data-loading]::after {
          content: ""; position: absolute; left: 0; top: 18%; height: 64%; width: 3.2em; border-radius: 8px;
          background: linear-gradient(90deg, rgba(148, 163, 184, 0.08), rgba(148, 163, 184, 0.2), rgba(148, 163, 184, 0.08));
          background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
        }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        
        /* Toasts */
        @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
        .toast { animation: toast-in 0.35s var(--ease); }
        .toast.is-leaving { opacity: 0; transform: translateY(6px); transition: opacity 0.3s, transform 0.3s; }
        
        /* Movimiento reducido: sin animaciones decorativas; la información se mantiene. */
        @media (prefers-reduced-motion: reduce) {
          html { scroll-behavior: auto; }
          *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
          }
          .reveal { opacity: 1; transform: none; }
        }
        effects.css
        /* HexaOrders v3 — plataforma: portal, roles, administración, operaciones y calendario logístico. */
        :root {
          --blue: #3B82F6;
          --blue-2: #60A5FA;
          --blue-soft: rgba(59, 130, 246, 0.14);
          --accent-gradient: linear-gradient(120deg, #8B5CF6 0%, #6366F1 45%, #3B82F6 100%);
        }
        
        /* Vista enrutada vs. laboratorio original */
        .view-root { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 24px 64px; }
        .view-root[hidden], [data-view="lab"][hidden] { display: none !important; }
        .view { padding-top: 40px; }
        .view__head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
        .view__title { font-size: clamp(1.7rem, 3.4vw, 2.4rem); }
        .breadcrumbs { display: flex; gap: 8px; color: var(--text-2); font-size: 0.82rem; margin-bottom: 10px; }
        .breadcrumbs a { color: var(--text-2); }
        .breadcrumbs a:hover { color: var(--text); }
        
        /* Barra superior ampliada: en el laboratorio se ven sus secciones; en la aplicación, las áreas del rol. */
        .view-root:focus { outline: none; }
        .nav a { white-space: nowrap; }
        body[data-mode="lab"] #role-nav, body[data-mode="lab"] [data-lab-link] { display: none; }
        body[data-mode="app"] .nav [data-nav] { display: none; }
        .topbar__actions { display: flex; align-items: center; gap: 8px; }
        .nav__group { display: flex; gap: 4px; padding-left: 8px; margin-left: 4px; border-left: 1px solid var(--line); }
        .nav__group:empty { display: none; }
        .icon-btn {
          position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px; cursor: pointer;
          border: 1px solid var(--line); background: rgba(21, 27, 35, 0.8); color: var(--text); font: inherit; font-size: 0.85rem;
        }
        .icon-btn:hover { border-color: var(--violet-2); }
        .icon-btn svg { width: 18px; height: 18px; }
        .icon-btn__badge {
          position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
          background: var(--accent-gradient); color: #fff; font-size: 0.68rem; font-weight: 700; display: grid; place-items: center;
        }
        .icon-btn__badge[hidden] { display: none; }
        .user-chip { display: inline-flex; align-items: center; gap: 8px; }
        .avatar {
          width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; font-weight: 800;
          background: var(--accent-gradient); color: #fff;
        }
        .menu { position: relative; }
        .menu__panel {
          position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; padding: 8px; z-index: 30;
          background: rgba(21, 27, 35, 0.98); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow);
        }
        .menu__panel[hidden] { display: none; }
        .menu__panel a, .menu__panel button {
          display: flex; width: 100%; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 8px; border: 0;
          background: transparent; color: var(--text); font: inherit; font-size: 0.88rem; cursor: pointer; text-align: left;
        }
        .menu__panel a:hover, .menu__panel button:hover { background: var(--violet-soft); color: var(--text); }
        .menu__meta { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
        .menu__meta small { display: block; color: var(--text-2); }
        
        /* Banner del portal */
        .shop-hero {
          position: relative; overflow: hidden; border-radius: 22px; padding: clamp(28px, 5vw, 56px);
          background:
            radial-gradient(60% 120% at 100% 0%, rgba(59, 130, 246, 0.28), transparent 60%),
            radial-gradient(50% 100% at 0% 100%, rgba(139, 92, 246, 0.3), transparent 60%),
            linear-gradient(180deg, rgba(28, 36, 48, 0.9), rgba(21, 27, 35, 0.95));
          border: 1px solid var(--line);
        }
        .shop-hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); max-width: 720px; letter-spacing: -0.03em; }
        .shop-hero p { color: var(--text-2); max-width: 620px; margin-top: 14px; font-size: 1.02rem; }
        .shop-hero__stats { display: flex; gap: 28px; margin-top: 26px; flex-wrap: wrap; }
        .shop-hero__stats strong { display: block; font-size: 1.4rem; }
        .shop-hero__stats span { color: var(--text-2); font-size: 0.8rem; }
        .feature-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0 30px; }
        .feature { padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(21, 27, 35, 0.6); }
        .feature strong { display: block; font-size: 0.92rem; margin: 8px 0 4px; }
        .feature p { color: var(--text-2); font-size: 0.8rem; }
        .feature__icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--violet-soft); color: var(--violet-2); }
        .feature__icon svg { width: 18px; height: 18px; }
        
        /* Catálogo */
        .catalog-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
        .catalog-toolbar input[type="search"] { flex: 1 1 260px; width: auto; }
        .catalog-toolbar select { width: auto; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip.is-active { border-color: var(--violet-2); color: var(--text); background: var(--violet-soft); }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
        .product-card {
          display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
          background: linear-gradient(180deg, rgba(28, 36, 48, 0.85), rgba(21, 27, 35, 0.92));
          transition: transform 0.25s var(--ease), border-color 0.25s, box-shadow 0.25s;
        }
        .product-card:hover { transform: translateY(-3px); border-color: rgba(167, 139, 250, 0.5); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4); }
        .product-card__media { position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; }
        .product-card__media svg { width: 34%; height: auto; color: rgba(255, 255, 255, 0.92); filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35)); }
        .product-card__tag { position: absolute; left: 10px; top: 10px; }
        .product-card__body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .product-card__body h3 { font-size: 0.98rem; }
        .product-card__body h3 a { color: var(--text); }
        .product-card__desc { color: var(--text-2); font-size: 0.8rem; flex: 1; }
        .product-card__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
        .price { font-weight: 750; font-size: 1.08rem; font-variant-numeric: tabular-nums; }
        .stock-note { font-size: 0.74rem; color: var(--text-2); }
        .stock-note--low { color: var(--amber); }
        .stock-note--out { color: var(--red); }
        
        .product-detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: start; }
        .product-detail__media { border-radius: 20px; aspect-ratio: 4 / 3; display: grid; place-items: center; border: 1px solid var(--line); }
        .product-detail__media svg { width: 30%; color: #fff; filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.35)); }
        .product-detail h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
        .product-detail .price { font-size: 1.8rem; display: block; margin: 14px 0; }
        .qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
        .qty button { width: 36px; height: 38px; border: 0; background: transparent; color: var(--text); cursor: pointer; font-size: 1.1rem; }
        .qty button:hover { background: var(--violet-soft); }
        .qty input { width: 52px; text-align: center; border: 0; border-radius: 0; background: transparent; padding: 8px 0; }
        .spec-list { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 8px; color: var(--text-2); font-size: 0.86rem; }
        .spec-list li { display: flex; gap: 8px; align-items: center; }
        
        /* Carrito y checkout */
        .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 18px; align-items: start; }
        .cart-line { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .cart-line__thumb { width: 64px; height: 52px; border-radius: 10px; display: grid; place-items: center; }
        .cart-line__thumb svg { width: 26px; color: #fff; }
        .cart-line small { color: var(--text-2); display: block; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; color: var(--text-2); font-size: 0.9rem; }
        .summary-row--total { color: var(--text); font-size: 1.15rem; font-weight: 750; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 14px; }
        .notice-box { padding: 12px 14px; border-radius: 12px; font-size: 0.84rem; border: 1px solid var(--line); background: rgba(59, 130, 246, 0.08); color: var(--text-2); }
        .notice-box strong { color: var(--text); }
        
        /* Línea de tiempo del pedido */
        .timeline { list-style: none; padding: 0; margin: 0; position: relative; }
        .timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: var(--line-strong); }
        .timeline li { position: relative; padding: 0 0 18px 36px; }
        .timeline li::before {
          content: ""; position: absolute; left: 4px; top: 4px; width: 16px; height: 16px; border-radius: 50%;
          background: var(--bg); border: 2px solid var(--violet-2);
        }
        .timeline li.is-current::before { background: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
        .timeline strong { display: block; font-size: 0.9rem; }
        .timeline small { color: var(--text-2); }
        .progress-steps { display: flex; gap: 4px; margin: 16px 0 8px; }
        .progress-steps span { flex: 1; height: 6px; border-radius: 999px; background: rgba(148, 163, 184, 0.16); }
        .progress-steps span.is-done { background: var(--accent-gradient); }
        .progress-steps span.is-failed { background: var(--red); }
        
        /* Estado del ciclo de vida */
        .lc { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 750; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
        .lc::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .lc--neutral { color: var(--text-2); background: rgba(148, 163, 184, 0.12); }
        .lc--violet { color: var(--violet-2); background: var(--violet-soft); }
        .lc--blue { color: var(--blue-2); background: var(--blue-soft); }
        .lc--ok { color: var(--green); background: var(--green-soft); }
        .lc--warn { color: var(--amber); background: var(--amber-soft); }
        .lc--error { color: #F87171; background: var(--red-soft); }
        
        /* Pestañas */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: thin; }
        .tabs a, .tabs button {
          padding: 10px 14px; color: var(--text-2); border: 0; background: transparent; font: inherit; font-size: 0.88rem;
          border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
        }
        .tabs a:hover, .tabs button:hover { color: var(--text); }
        .tabs .is-active { color: var(--text); border-bottom-color: var(--violet); }
        
        /* KPIs y gráficos */
        .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .kpi { padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(21, 27, 35, 0.75); }
        .kpi span { display: block; color: var(--text-2); font-size: 0.76rem; }
        .kpi strong { display: block; font-size: 1.6rem; font-weight: 750; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .kpi--ok strong { color: var(--green); }
        .kpi--warn strong { color: var(--amber); }
        .kpi--error strong { color: #F87171; }
        .kpi--violet strong { color: var(--violet-2); }
        .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
        .grid-2-even { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .chart { width: 100%; height: 220px; }
        .chart text { fill: var(--text-2); font: 10px var(--font); }
        .chart .bar { fill: url(#bar-gradient); }
        .chart .bar:hover { fill: var(--violet-2); }
        .chart .grid-line { stroke: rgba(148, 163, 184, 0.12); }
        .activity { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; max-height: 360px; overflow: auto; }
        .activity li { padding: 9px 10px; border-radius: 10px; background: rgba(11, 15, 20, 0.45); border: 1px solid var(--line); font-size: 0.82rem; }
        .activity small { color: var(--text-2); display: block; }
        .alerts-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
        .alerts-list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 0.84rem; border: 1px solid var(--line); }
        .alerts-list li.is-warn { border-color: rgba(245, 158, 11, 0.4); background: var(--amber-soft); }
        .alerts-list li.is-error { border-color: rgba(239, 68, 68, 0.4); background: var(--red-soft); }
        .alerts-list li.is-ok { border-color: rgba(16, 185, 129, 0.35); background: var(--green-soft); }
        
        /* Tablas de administración */
        .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
        .role-checks { display: flex; flex-wrap: wrap; gap: 6px; }
        .role-checks label { display: inline-flex; gap: 5px; align-items: center; font-size: 0.74rem; color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; cursor: pointer; }
        .role-checks input { width: auto; accent-color: var(--violet); }
        .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.82rem; color: var(--text-2); }
        .switch input { width: auto; accent-color: var(--green); }
        .swatch { display: inline-block; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; }
        
        /* Modal */
        .modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(5, 8, 12, 0.72); backdrop-filter: blur(4px); }
        .modal__dialog {
          width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 18px; padding: 22px;
          background: linear-gradient(180deg, #1C2430, #151B23); border: 1px solid var(--line-strong); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
          animation: toast-in 0.25s var(--ease);
        }
        .modal__dialog--wide { width: min(780px, 100%); }
        .modal__head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
        .modal__head h2 { font-size: 1.15rem; }
        .modal__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        .form-grid .field--full { grid-column: 1 / -1; }
        textarea {
          width: 100%; min-height: 84px; resize: vertical; font: inherit; color: var(--text);
          background: rgba(11, 15, 20, 0.75); border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 13px;
        }
        textarea:focus { outline: none; border-color: var(--violet-2); box-shadow: 0 0 0 3px var(--violet-soft); }
        .form-error { color: #FCA5A5; font-size: 0.84rem; margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.4); background: var(--red-soft); }
        .form-error[hidden] { display: none; }
        
        /* Autenticación */
        .auth { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; max-width: 980px; margin: 0 auto; }
        .auth__aside {
          border-radius: 20px; padding: 32px; border: 1px solid var(--line);
          background: radial-gradient(80% 80% at 0% 0%, rgba(139, 92, 246, 0.28), transparent 70%),
                      radial-gradient(70% 70% at 100% 100%, rgba(59, 130, 246, 0.22), transparent 70%), rgba(21, 27, 35, 0.9);
        }
        .auth__aside h2 { font-size: 1.6rem; margin: 16px 0 10px; }
        .auth__aside p { color: var(--text-2); }
        .demo-accounts { display: grid; gap: 8px; margin-top: 22px; }
        .demo-accounts button {
          display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px;
          border: 1px solid var(--line); background: rgba(11, 15, 20, 0.55); color: var(--text); font: inherit; font-size: 0.85rem; cursor: pointer; text-align: left;
        }
        .demo-accounts button:hover { border-color: var(--violet-2); background: var(--violet-soft); }
        .demo-accounts small { color: var(--text-2); }
        
        /* Estados vacíos */
        .empty-state { text-align: center; padding: 48px 20px; color: var(--text-2); }
        .empty-state svg { width: 46px; height: 46px; color: var(--violet-2); opacity: 0.8; margin: 0 auto 12px; }
        .empty-state strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }
        .skeleton { border-radius: 12px; background: linear-gradient(90deg, rgba(148,163,184,0.06), rgba(148,163,184,0.16), rgba(148,163,184,0.06)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
        .skeleton--card { height: 290px; }
        .skeleton--row { height: 44px; margin-bottom: 8px; }
        
        /* Calendario logístico */
        .cal-toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
        .cal-toolbar__nav { display: flex; gap: 6px; align-items: center; }
        .cal-toolbar h3 { font-size: 1.1rem; min-width: 220px; text-transform: capitalize; }
        .cal-month { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .cal-month__dow { padding: 8px; font-size: 0.7rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em; background: rgba(11, 15, 20, 0.5); border-bottom: 1px solid var(--line); }
        .cal-day {
          min-height: 108px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
          background: rgba(21, 27, 35, 0.55); display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left;
          font: inherit; color: var(--text); border-top: 0; border-left: 0;
        }
        .cal-day:nth-child(7n + 7) { border-right: 0; }
        .cal-day:hover { background: rgba(139, 92, 246, 0.07); }
        .cal-day.is-other { opacity: 0.45; }
        .cal-day.is-today .cal-day__num { background: var(--violet); color: #fff; }
        .cal-day__num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 0.78rem; font-weight: 650; }
        .cal-event {
          display: block; width: 100%; padding: 3px 6px; border-radius: 6px; font-size: 0.7rem; text-align: left; cursor: pointer; border: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; font-family: inherit;
        }
        .cal-event:focus-visible { outline: 2px solid #fff; }
        .cal-more { font-size: 0.68rem; color: var(--text-2); }
        .cal-week { display: grid; grid-template-columns: 56px repeat(7, 1fr); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
        .cal-week__head { padding: 8px 6px; font-size: 0.74rem; color: var(--text-2); text-align: center; background: rgba(11, 15, 20, 0.5); border-bottom: 1px solid var(--line); text-transform: capitalize; }
        .cal-week__head.is-today { color: var(--violet-2); font-weight: 700; }
        .cal-week__hours { position: relative; }
        .cal-week__hour { height: 44px; font-size: 0.66rem; color: var(--text-2); text-align: right; padding: 2px 6px 0 0; border-bottom: 1px solid rgba(148, 163, 184, 0.07); }
        .cal-week__col { position: relative; border-left: 1px solid var(--line); background: rgba(21, 27, 35, 0.4); }
        .cal-week__slot { height: 44px; border-bottom: 1px solid rgba(148, 163, 184, 0.07); cursor: pointer; }
        .cal-week__slot:hover { background: rgba(139, 92, 246, 0.08); }
        .cal-week__event { position: absolute; left: 3px; right: 3px; padding: 4px 6px; border-radius: 8px; font-size: 0.68rem; color: #fff; overflow: hidden; cursor: pointer; border: 0; text-align: left; font-family: inherit; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
        .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.76rem; color: var(--text-2); margin-top: 10px; }
        .cal-legend span { display: inline-flex; gap: 6px; align-items: center; }
        .cal-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
        .day-list { display: grid; gap: 10px; }
        .day-list__item { display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(21, 27, 35, 0.6); }
        .day-list__time { font-family: var(--mono); font-size: 0.82rem; }
        
        /* Responsive de la plataforma */
        @media (max-width: 1080px) {
          .feature-row { grid-template-columns: repeat(2, 1fr); }
          .cart-layout, .grid-2, .product-detail { grid-template-columns: 1fr; }
        }
        @media (max-width: 860px) {
          .auth, .grid-2-even, .form-grid { grid-template-columns: 1fr; }
          .nav__group { border-left: 0; padding-left: 0; }
          .cal-day { min-height: 74px; }
          .cal-event { font-size: 0.62rem; }
          .cal-week { grid-template-columns: 40px repeat(7, minmax(80px, 1fr)); overflow-x: auto; }
        }
        @media (max-width: 520px) {
          .view-root { padding: 0 16px 48px; }
          .feature-row { grid-template-columns: 1fr; }
          .cart-line { grid-template-columns: 52px 1fr; }
          .cart-line > :nth-child(n + 3) { grid-column: 2; }
          .day-list__item { grid-template-columns: 1fr; }
          .user-chip__name { display: none; }
        }
