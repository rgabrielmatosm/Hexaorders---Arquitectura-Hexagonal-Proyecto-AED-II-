isplay:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}.table-top h2{margin:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:500}th,td{padding:15px 12px 15px 0;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right;padding-right:0}.pill{display:inline-block;padding:4px 8px;border-radius:5px;font-size:10px;font-weight:750;letter-spacing:.4px;background:#263d28;color:var(--accent)}.pill.review{background:#493b24;color:var(--warn)}.id{font:10px ui-monospace,monospace;color:var(--muted);display:block}.score{font-family:ui-monospace,monospace}.empty{color:var(--muted);text-align:center!important;padding:50px 0}.notice{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:6px;font-size:13px;overflow-wrap:anywhere}.notice.error{color:var(--warn);border-color:#796440}.notice.success{color:var(--accent)}details{margin-top:24px;color:var(--muted);font-size:12px}summary{cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:16px;border-radius:6px;font:11px/1.6 ui-monospace,monospace}footer{margin-top:32px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px;display:flex;gap:18px;justify-content:space-between}a{color:var(--accent)}@media(max-width:850px){.workspace{grid-template-columns:1fr}main{padding:22px 18px}.card{padding:20px}footer{flex-direction:column}h1{letter-spacing:-1px}}
