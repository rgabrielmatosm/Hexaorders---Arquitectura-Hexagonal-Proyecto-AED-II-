        /* HexaOrders — tokens de diseño, base tipográfica y layout. */
        :root {
          color-scheme: dark;
          --bg: #0B0F14;
          --bg-2: #151B23;
          --bg-3: #1C2430;
          --line: rgba(148, 163, 184, 0.14);
          --line-strong: rgba(148, 163, 184, 0.28);
          --violet: #8B5CF6;
          --violet-2: #A78BFA;
          --violet-soft: rgba(139, 92, 246, 0.14);
          --green: #10B981;
          --green-soft: rgba(16, 185, 129, 0.14);
          --amber: #F59E0B;
          --amber-soft: rgba(245, 158, 11, 0.14);
          --red: #EF4444;
          --red-soft: rgba(239, 68, 68, 0.14);
          --text: #F8FAFC;
          --text-2: #94A3B8;
          --radius: 14px;
          --radius-sm: 9px;
          --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
          --font: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
          --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
          --topbar-h: 64px;
          --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        *, *::before, *::after { box-sizing: border-box; }
        
        html { scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 16px); }
        
        body {
          margin: 0;
          min-height: 100vh;
          background: var(--bg);
          color: var(--text);
          font: 15px/1.6 var(--font);
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
        }
        
        img, svg, canvas { display: block; max-width: 100%; }
        
        h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
        h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
        h3 { font-size: 1.05rem; }
        p { margin: 0; }
        
        a { color: var(--violet-2); text-decoration: none; }
        a:hover { color: var(--text); }
        
        code, kbd, .mono { font-family: var(--mono); font-size: 0.86em; }
        code { background: var(--violet-soft); color: var(--violet-2); padding: 0.1em 0.4em; border-radius: 5px; }
        kbd { border: 1px solid var(--line-strong); border-radius: 5px; padding: 0.05em 0.45em; color: var(--text-2); }
        
        :focus-visible { outline: 2px solid var(--violet-2); outline-offset: 3px; border-radius: 6px; }
        
        ::selection { background: rgba(139, 92, 246, 0.45); }
        
        .muted { color: var(--text-2); }
        .small { font-size: 0.82rem; line-height: 1.55; }
        
        .sr-only {
          position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
          overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
        
        .skip-link {
          position: absolute; left: 16px; top: -60px; z-index: 100;
          background: var(--violet); color: #fff; padding: 10px 14px; border-radius: var(--radius-sm);
        }
        .skip-link:focus { top: 12px; }
        
        /* Layout */
        main { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 24px 64px; }
        
