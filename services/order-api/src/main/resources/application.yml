spring:
  application:
    name: order-api
  # v5: integraciones del perfil "full" de Docker Compose (nombres de servicio, nunca localhost).
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 300ms
      connect-timeout: 300ms
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    # Usuario heredado: RabbitMQ lo guardó en su volumen al inicializarse (docs/MIGRACION_POLYMER.md).
    username: ${RABBITMQ_USER:hexaorders}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: 8080
  shutdown: graceful
  # v7: detrás del gateway Nginx (y del Nginx del host en AWS) se respetan X-Forwarded-Proto/Host de proxies
  # internos: la URL de retorno de Google y la cookie Secure usan el esquema y el host públicos.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 64
      min-spare: 4
    max-http-form-post-size: 16KB
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # v5: Redis, RabbitMQ y SMTP son opcionales (perfil "full"); su salud no decide si order-api está listo.
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false
  # Trazas OTLP hacia otel-collector → Tempo (IntegrationEnvironment las activa solo si el collector existe).
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}
logging:
  level:
    root: INFO
