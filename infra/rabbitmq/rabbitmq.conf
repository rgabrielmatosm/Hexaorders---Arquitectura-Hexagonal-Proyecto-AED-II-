# HexaOrders · RabbitMQ (perfil "full"). Usuario y contraseña: conf.d/20-credentials.conf (tmpfs).
listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692
# Métricas por cola (pocas colas): permiten ver la cola de notificaciones y la DLQ en Grafana.
prometheus.return_per_object_metrics = true
loopback_users.guest = true
log.console = true
log.console.level = warning
log.file = false
disk_free_limit.absolute = 200MB
