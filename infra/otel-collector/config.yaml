# Flujo: order-api / risk-engine --OTLP--> collector --OTLP--> Tempo.  Nginx stub_status --> métricas.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  nginx:
    endpoint: http://frontend:8081/nginx_status
    collection_interval: 15s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  # Defensa en profundidad: ningún span sale con cookies, credenciales o datos personales.
  attributes/redact:
    actions:
      - { key: http.request.header.cookie, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: user.email, action: delete }
      - { key: enduser.id, action: delete }
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      queue_size: 2000
  prometheus/nginx:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/tempo]
    metrics/nginx:
      receivers: [nginx]
      processors: [memory_limiter, batch]
      exporters: [prometheus/nginx]
