# POLYMER — Nginx del HOST (EC2) como terminación TLS. Plantilla: sustituye
#   TIENDA.EJEMPLO.COM   → tu dominio de la tienda (registro A hacia la IP elástica)
#   GRAFANA.EJEMPLO.COM  → tu subdominio de Grafana (registro A hacia la misma IP)
#   203.0.113.10/32      → la IP pública de quien administra (para Grafana y la API del laboratorio)
# Instalación: /etc/nginx/sites-available/polymer.conf + enlace en sites-enabled. Certificados de
# Let's Encrypt con certbot (ver docs/final/DESPLIEGUE_AWS_HTTPS.md). Los contenedores solo escuchan en
# 127.0.0.1: este archivo es la ÚNICA exposición pública.

# HTTP → HTTPS (y desafío ACME de Let's Encrypt).
server {
    listen 80;
    listen [::]:80;
    server_name TIENDA.EJEMPLO.COM GRAFANA.EJEMPLO.COM;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Tienda POLYMER (gateway Nginx del contenedor frontend en 127.0.0.1:8080).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TIENDA.EJEMPLO.COM;

    ssl_certificate     /etc/letsencrypt/live/TIENDA.EJEMPLO.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TIENDA.EJEMPLO.COM/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:polymer_tls:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # API original del laboratorio (POST /api/orders sin sesión): solo desde la IP de administración.
    location ^~ /api/orders {
        allow 203.0.113.10/32;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/polymer-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/polymer-proxy.conf;
    }
}

# Grafana (127.0.0.1:3000): inicio de sesión propio de Grafana + lista de IP permitidas.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name GRAFANA.EJEMPLO.COM;

    ssl_certificate     /etc/letsencrypt/live/TIENDA.EJEMPLO.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TIENDA.EJEMPLO.COM/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    allow 203.0.113.10/32;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/polymer-proxy.conf;
    }
    # Grafana Live usa WebSocket.
    location /api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
# Prometheus (9091), RabbitMQ (15672) y Mailpit (8025) NO se publican: se usan con
# «aws ssm start-session … AWS-StartPortForwardingSession» o un túnel SSH (ver la guía).
