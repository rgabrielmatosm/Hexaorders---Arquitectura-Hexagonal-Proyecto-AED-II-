# HexaOrders gateway (ADR 0011). Contenedores read_only: temporales en /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Logs JSON para Loki. $uri NO incluye la query string ni cabeceras (sin cookies ni tokens).
    log_format hexaorders escape=json '{"time":"$time_iso8601","service":"frontend","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_status":"$upstream_status","upstream_s":"$upstream_response_time","request_id":"$request_id"}';
    access_log /dev/stdout hexaorders;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # DNS interno de Docker: se vuelve a resolver order-api cada 10 s (sobrevive a reinicios).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        set $order_api http://order-api:8080;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Recursos públicos e idénticos a los de order-api: los sirve Nginx (comprimidos y cacheables).
        location ~ ^/(css|js|img)/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 10m;
            add_header Cache-Control "public, max-age=600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://*:9091 https://*:9091 http://*:3000 https://*:3000; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        }

        # Páginas HTML (públicas y protegidas por rol), /api y URLs limpias: Spring Boot decide.
        location / {
            proxy_pass $order_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }
    }

    # Solo red interna "telemetry": estado de Nginx para el OpenTelemetry Collector (receptor nginx).
    server {
        listen 8081;
        access_log off;
        location = /nginx_status { stub_status; }
    }
}
