global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    project: hexaorders
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: order-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-api:9090]
  - job_name: risk-engine
    metrics_path: /metrics
    static_configs:
      - targets: [risk-engine:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

