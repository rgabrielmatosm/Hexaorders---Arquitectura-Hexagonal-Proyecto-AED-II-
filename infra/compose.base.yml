# POLYMER — entregar docker-compose.yml, generado desde este archivo.
# Docker Compose >= 2.23.1 + BuildKit + contenedores Linux.
# Arquitectura: las dependencias del código apuntan hacia domain/application.
#
# v5 · Modos de ejecución (docs/DOCKER_ARCHITECTURE.md):
#   básico   (sin perfil)        db, risk-engine, order-api, prometheus, grafana y frontend (gateway).
#   completo (perfil "full")     + redis, rabbitmq, mailpit, loki, tempo, otel-collector y alloy.
#   PowerShell: .\polymer.cmd start  (completo)  ·  .\polymer.cmd start -Mode basic
name: polymer

x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  # Alloy solo recoge los logs de contenedores con esta etiqueta (nunca los de otros proyectos).
  labels:
    com.polymer.logs: 'true'

services:
  # 1. Adaptador de persistencia: solo order-api conoce esta base de datos.
  db:
    <<: *runtime
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # 2. Segundo hexágono: Python calcula riesgo mediante reglas deterministas.
  risk-engine:
    <<: *runtime
    image: polymer/risk-engine:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_RISK__
    environment:
      # v5: trazas OTLP solo si existe otel-collector (perfil "full"); si no, se ejecuta igual que antes.
      POLYMER_INTEGRATIONS: auto
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: risk-engine
    depends_on:
      otel-collector:
        condition: service_healthy
        required: false
    # v8 · Enlace del contenedor (Docker Desktop → 8000:8000): documentación interactiva de POST /score.
    # Solo en 127.0.0.1 (no se expone a la red); «edge» es la red no interna que permite publicar el puerto.
    ports:
      - '127.0.0.1:8000:8000'
    networks: [compute, telemetry, edge]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # 3. Adaptador REST -> puerto de entrada -> caso de uso -> puertos de salida.
  order-api:
    <<: *runtime
    image: polymer/order-api:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_JAVA__
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: orders
      DB_USER: orders
      DB_PASSWORD_FILE: /run/secrets/db_password
      # Contraseña común de las cuentas de demostración (se crean una sola vez al arrancar).
      DEMO_PASSWORD_FILE: /run/secrets/demo_password
      RISK_BASE_URL: http://risk-engine:8000
      # v4: el portal de monitoreo consulta Prometheus por la red interna telemetry (nunca localhost).
      PROMETHEUS_URL: http://prometheus:9090
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError'
      # v5: cada integración se activa sola si su servicio existe (perfil "full"); ver IntegrationEnvironment.
      POLYMER_INTEGRATIONS: auto
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: hexaorders
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      # v7: correo. Por defecto Mailpit (captura local). Para enviar a Gmail u otro buzón real: POLYMER_SMTP_* en .env
      # y la contraseña de aplicación en secrets/smtp_password.txt (vacío = sin autenticación). Ver docs/final/GUIA_GOOGLE_Y_PAGOS.md.
      SMTP_HOST: ${POLYMER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${POLYMER_SMTP_PORT:-1025}
      SMTP_USERNAME: ${POLYMER_SMTP_USERNAME:-}
      SMTP_STARTTLS: ${POLYMER_SMTP_STARTTLS:-true}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      POLYMER_MAIL_FROM: ${POLYMER_MAIL_FROM:-Polymer <no-reply@polymer.local>}
      # v7: «Continuar con Google» (OpenID Connect). Vacíos = botón oculto. Origen público para los enlaces de los correos.
      GOOGLE_CLIENT_ID_FILE: /run/secrets/google_client_id
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      POLYMER_PUBLIC_URL: ${POLYMER_PUBLIC_URL:-http://localhost:8080}
      # v7: tienda física (mapa de Google Maps, horario de hoy) y calendario público opcional de Google Calendar.
      POLYMER_STORE_ADDRESS: ${POLYMER_STORE_ADDRESS:-Av. Javier Prado Este 4200}
      POLYMER_STORE_DISTRICT: ${POLYMER_STORE_DISTRICT:-Santiago de Surco}
      POLYMER_STORE_LATITUDE: ${POLYMER_STORE_LATITUDE:--12.0853}
      POLYMER_STORE_LONGITUDE: ${POLYMER_STORE_LONGITUDE:--76.9753}
      POLYMER_GOOGLE_CALENDAR_ID: ${POLYMER_GOOGLE_CALENDAR_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets: [db_password, demo_password, rabbitmq_password, google_client_id, google_client_secret, smtp_password]
    depends_on:
      db:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
      # Dependencias opcionales: en el modo básico no existen y order-api arranca sin ellas.
      redis:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
      mailpit:
        condition: service_healthy
        required: false
      otel-collector:
        condition: service_healthy
        required: false
    # v5: el navegador entra por el gateway (frontend) en 127.0.0.1:8080.
    # v8 · Enlace del contenedor (Docker Desktop → 8081:8080): el núcleo hexagonal respondiendo SIN el gateway
    # (misma tienda y misma API; útil para mostrar que el gateway solo es un adaptador de borde). Solo 127.0.0.1.
    # «Continuar con Google» se usa siempre por 8080 (la URL de retorno registrada en Google).
    # v7: «egress» = salida a Internet SOLO para order-api (Google OpenID Connect y un SMTP real).
    ports:
      - '127.0.0.1:8081:8080'
    networks: [gateway, data, compute, telemetry, cache, messaging, egress]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', http://127.0.0.1:9090/actuator/health/readiness]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 40s

  # 4. Pull de métricas; no forma parte del núcleo ni del camino del pedido.
  prometheus:
    <<: *runtime
    image: polymer/prometheus:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_PROMETHEUS__
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --no-web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9091:9090'
    networks: [edge, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 6

  # 5. Datasources (Prometheus; v5: Loki y Tempo) y dashboards provisionados: cero configuración manual.
  grafana:
    <<: *runtime
    image: polymer/grafana:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_GRAFANA__
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    secrets: [grafana_password]
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks: [edge, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # 6. Gateway web (v5, ADR 0011): sirve css/js/img y reenvía páginas y /api a order-api.
  frontend:
    <<: *runtime
    image: polymer/frontend:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_FRONTEND__
    depends_on:
      order-api:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    networks: [edge, gateway, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # ---------------------------------------------------------------- perfil "full"

  # 7. Caché del catálogo público (no es fuente de verdad: PostgreSQL lo es). Red interna "cache".
  redis:
    <<: *runtime
    profiles: [full]
    image: redis:7.4.12-alpine
    user: '999:999'
    command: [redis-server, --protected-mode, 'no', --save, '300', '1', --appendonly, 'no',
              --maxmemory, 48mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - redis_data:/data
    networks: [cache]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=8m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  # 8. Mensajería asíncrona de eventos de negocio (outbox → exchange → cola de notificaciones → DLQ).
  rabbitmq:
    <<: *runtime
    profiles: [full]
    image: polymer/rabbitmq:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_RABBITMQ__
    hostname: rabbitmq  # nombre de nodo estable: los mensajes persisten al recrear el contenedor
    environment:
      RABBITMQ_USER: hexaorders
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'  # consola de gestión (usuario polymer, secrets\rabbitmq_password.txt)
    networks: [edge, messaging, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,size=32m', '/etc/rabbitmq/conf.d:rw,noexec,nosuid,size=1m']
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  # 9. Servidor SMTP de DESARROLLO: captura los correos de notificación (no envía nada a Internet).
  mailpit:
    <<: *runtime
    profiles: [full]
    image: axllent/mailpit:v1.33.0
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: 'false'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'false'
    ports:
      - '127.0.0.1:8025:8025'  # interfaz web de Mailpit
    networks: [edge, messaging]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 3s
      retries: 6

  # 10. Logs centralizados (consulta desde Grafana → Explore → Loki).
  loki:
    <<: *runtime
    profiles: [full]
    image: polymer/loki:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_LOKI__
    volumes:
      - loki_data:/loki
    networks: [telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, /usr/local/bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:3100/ready]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # 11. Trazas distribuidas (Grafana → Explore → Tempo; X-Trace-Id en cada respuesta de la API).
  tempo:
    <<: *runtime
    profiles: [full]
    image: polymer/tempo:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_TEMPO__
    volumes:
      - tempo_data:/var/tempo
    networks: [telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, /usr/local/bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:3200/ready]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # 12. Recepción y procesamiento de telemetría OTLP (→ Tempo) y métricas de Nginx (→ Prometheus).
  otel-collector:
    <<: *runtime
    profiles: [full]
    image: polymer/otel-collector:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_OTEL_COLLECTOR__
    depends_on:
      tempo:
        condition: service_healthy
    # v8 · Enlace del contenedor (13133): estado del recolector OpenTelemetry. Solo 127.0.0.1.
    ports:
      - '127.0.0.1:13133:13133'
    networks: [telemetry, edge]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, /busybox, wget, -q, -O, /dev/null, http://127.0.0.1:13133/]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # 13. Agente de logs (necesario para Loki en Docker Desktop): lee los logs de los contenedores de
  #     este proyecto por la API de Docker (socket en solo lectura) y los envía a Loki sin secretos.
  alloy:
    <<: *runtime
    profiles: [full]
    image: polymer/alloy:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_ALLOY__
    user: '0:0'  # leer /var/run/docker.sock (sin capacidades: cap_drop ALL)
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - alloy_data:/var/lib/polymer-alloy  # directorio propio: el de la imagen base no es escribible sin capacidades
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # v8 · Enlace del contenedor (12345): interfaz de Alloy con el flujo de logs Docker → Loki. Solo 127.0.0.1.
    ports:
      - '127.0.0.1:12345:12345'
    networks: [telemetry, edge]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, /usr/local/bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:12345/-/ready]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

# IPs variables; descubrimiento por nombre de servicio, nunca localhost entre servicios.
networks:
  edge: {}
  data:
    internal: true
  compute:
    internal: true
  telemetry:
    internal: true
  # v5: gateway ↔ order-api; caché; mensajería y SMTP. Todas internas (sin salida a Internet).
  gateway:
    internal: true
  cache:
    internal: true
  messaging:
    internal: true
  # v7: salida a Internet de order-api (tokens de Google y relé SMTP). Ningún otro servicio la usa.
  egress: {}

# `down` conserva estos volúmenes; `down -v` elimina los datos.
volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}
  redis_data: {}
  rabbitmq_data: {}
  loki_data: {}
  tempo_data: {}
  alloy_data: {}

# Los valores se generan al desplegar en ./secrets/ (junto a este archivo), nunca se
# incrustan en el entregable ni en Git. Se usan archivos y no `environment:` porque
# Compose solo puede montar secretos de archivo en servicios read_only (bind mount de
# solo lectura). No equivale al almacén cifrado de secretos de Swarm.
secrets:
  db_password:
    file: ./secrets/db_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  demo_password:
    file: ./secrets/demo_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  # v7: opcionales; polymer.cmd los crea VACÍOS si no existen (vacío = integración desactivada).
  google_client_id:
    file: ./secrets/google_client_id.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
