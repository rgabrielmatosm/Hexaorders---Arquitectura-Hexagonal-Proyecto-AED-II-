# HEXAORDERS — entregar docker-compose.yml, generado desde este archivo.
# Docker Compose >= 2.23.1 + BuildKit + contenedores Linux.
# Arquitectura: las dependencias del código apuntan hacia domain/application.
name: hexaorders

x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  # 1. Adaptador de persistencia: solo order-api conoce esta base de datos.
  db:
    <<: *runtime
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # 2. Segundo hexágono: Python calcula riesgo mediante reglas deterministas.
  risk-engine:
    <<: *runtime
    image: hexaorders/risk-engine:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_RISK__
    networks: [compute, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # 3. Adaptador REST -> puerto de entrada -> caso de uso -> puertos de salida.
  order-api:
    <<: *runtime
    image: hexaorders/order-api:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_JAVA__
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: orders
      DB_USER: orders
      DB_PASSWORD_FILE: /run/secrets/db_password
      RISK_BASE_URL: http://risk-engine:8000
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError'
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    networks: [edge, data, compute, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '3', http://127.0.0.1:9090/actuator/health/readiness]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 40s

  # 4. Pull de métricas; no forma parte del núcleo ni del camino del pedido.
  prometheus:
    <<: *runtime
    image: hexaorders/prometheus:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_PROMETHEUS__
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle=false
    volumes:
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9091:9090'
    networks: [edge, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 6

  # 5. Datasource y dashboard provisionados: cero configuración manual en la demo.
  grafana:
    <<: *runtime
    image: hexaorders/grafana:1.0.0
    build:
      context: .
      dockerfile_inline: __INLINE_GRAFANA__
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    secrets: [grafana_password]
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks: [edge, telemetry]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

# IPs variables; descubrimiento por nombre de servicio, nunca localhost entre servicios.
networks:
  edge: {}
  data:
    internal: true
  compute:
    internal: true
  telemetry:
    internal: true

# `down` conserva estos volúmenes; `down -v` elimina los datos.
volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}

# Los valores se proporcionan al desplegar, nunca se incrustan en el entregable.
# Compose local monta archivos: no equivale al almacén cifrado de secretos de Swarm.
secrets:
  db_password:
    environment: DB_PASSWORD
  grafana_password:
    environment: GRAFANA_PASSWORD
