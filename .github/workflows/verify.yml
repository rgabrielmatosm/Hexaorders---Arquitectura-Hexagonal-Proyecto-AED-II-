name: Verify POLYMER
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # Prueba integral con Docker. GitHub solo ofrece contenedores Linux en runners Ubuntu
  # (los runners Windows no ejecutan contenedores Linux), así que este job usa Ubuntu, pero
  # ejecuta EXACTAMENTE el mismo script PowerShell que usas en Windows: tools/polymer.ps1.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      DB_PASSWORD: ci-only-ephemeral-db-password
      GRAFANA_PASSWORD: ci-only-ephemeral-grafana-password
      DEMO_PASSWORD: ci-only-demo-password-2026
      RABBITMQ_PASSWORD: ci-only-ephemeral-rabbitmq-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pasos 1-10 (modo full, 13 contenedores): entregable al día, build con tests, promtool y
      # validación del collector, servicios sanos, smoke y plataforma a través del gateway Nginx,
      # integraciones reales (Redis, RabbitMQ, Mailpit, Tempo, OpenTelemetry, Loki, Grafana),
      # degradación sin Redis/RabbitMQ, persistencia tras reiniciar y HTTP 503 sin risk-engine.
      - name: Verify delivery end to end (tools/polymer.ps1 verify, modo full)
        run: ./tools/polymer.ps1 verify -Mode full -WorkDir (Join-Path $env:RUNNER_TEMP 'polymer-delivery') -KeepRunning
      # Interfaz web contra el stack REAL que verify deja en marcha: formulario, panel,
      # explorador de arquitectura, observabilidad con Prometheus/Grafana y vista móvil.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in services/order-api/src/main/resources/static/js/*.js services/order-api/src/main/resources/static/js/views/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"; node --check "$RUNNER_TEMP/check.mjs" || { echo "::error file=$f::sintaxis JavaScript no válida"; exit 1; }
          done
      - name: Static multipage checks (pages, routes, links, CSP, role rules)
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_pages.py --check
          python tools/check_frontend.py
          python tools/generate_brand.py --check
          python tools/check_i18n.py
      - name: UI end to end against the real stack (Playwright)
        shell: bash
        working-directory: tools/ui-e2e
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/ui-screenshots
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node ui-e2e.js
      # v4: recorre las 39 páginas HTML como visitante y con cada rol (200/302/403/404), enlaces,
      # recargas, formularios reales, monitoreo leído de Prometheus y vista móvil.
      - name: Multipage site end to end (every page, every role)
        shell: bash
        working-directory: tools/ui-e2e
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/ui-screenshots
        run: node pages-e2e.js
      # POLYMER: intro (una vez por sesión, omitir, sonido opcional, movimiento reducido, móvil, paneles
      # internos sin intro), pie comercial con enlaces reales, Libro de reclamaciones y vuelo al carrito.
      - name: POLYMER brand, intro and motion end to end
        shell: bash
        working-directory: tools/ui-e2e
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/ui-screenshots
        run: node intro-e2e.js
      # Multilingüe: /es /en /fr /it /pt /de con recarga, SEO (lang, hreflang, canonical, sitemap), selector
      # que conserva página, filtros, carrito y sesión, permisos por idioma, checkout en inglés,
      # contraseñas (indicador y rechazo en el servidor) y vista móvil.
      - name: Multilingual site and password security end to end
        shell: bash
        working-directory: tools/ui-e2e
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/ui-screenshots
        run: node i18n-e2e.js
      # Exposición: los MISMOS escenarios que se ejecutan en Windows con «.\polymer.cmd demo», contra el stack
      # real. Cada uno falla si una evidencia no se cumple (claves y TTL de Redis, filas de PostgreSQL, colas
      # de RabbitMQ, correos de Mailpit, métricas, 503 sin risk-engine, adaptador sustituido…).
      - name: Exposición — escenarios de demostración contra el stack real (tools/demo/polymer-demo.ps1)
        run: |
          $compose = Join-Path $env:RUNNER_TEMP 'polymer-delivery/docker-compose.yml'
          $common = @{ ComposeFile = $compose; Project = 'polymer-verify'; NoPause = $true }
          foreach ($scenario in 'preparar', 'arquitectura', 'rabbitmq', 'postgres', 'riesgo', 'observabilidad',
                                'redis-caida', 'rabbitmq-caida', 'riesgo-caida') {
            ./tools/demo/polymer-demo.ps1 -Scenario $scenario @common
          }
          # Modo demostración: TTL de 15 s y adaptador de riesgo fijo; después, vuelta a la configuración normal.
          ./tools/demo/polymer-demo.ps1 -Scenario activar-demo -DemoTtl 15 -FixedRisk -FixedScore 10 @common
          ./tools/demo/polymer-demo.ps1 -Scenario redis @common
          ./tools/demo/polymer-demo.ps1 -Scenario adaptador @common
          ./tools/demo/polymer-demo.ps1 -Scenario desactivar-demo @common
          ./tools/demo/polymer-demo.ps1 -Scenario preparar @common
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymer-ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: ignore
      # Seguros aunque falle cualquier paso anterior: si no existe el entregable, terminan sin error.
      - name: Show diagnostics on failure
        if: failure()
        run: ./tools/polymer.ps1 diagnose -WorkDir (Join-Path $env:RUNNER_TEMP 'polymer-delivery')
      - name: Cleanup ephemeral CI resources
        if: always()
        run: ./tools/polymer.ps1 cleanup -WorkDir (Join-Path $env:RUNNER_TEMP 'polymer-delivery')

  # Lo que se ejecuta en un PC con Windows: lanzador .cmd, scripts en Windows PowerShell 5.1,
  # generación de secretos, generador determinista y tests unitarios de Python y Java.
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        run: |
          $failed = $false
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "::error file=tools/$($_.Extent.File | Split-Path -Leaf),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Host "OK $($_.Name)" }
          }
          if ($failed) { exit 1 }
      - name: Windows launcher shows help (polymer.cmd)
        shell: cmd
        run: polymer.cmd help
      # Este paso y "check" se ejecutan con Windows PowerShell 5.1 (powershell.exe), el que
      # trae Windows; polymer.cmd usa PowerShell 7 si está instalado, como en este runner.
      - name: Generate secrets with Windows PowerShell 5.1 (idempotent, no trailing newline)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'secrets-test'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\polymer.ps1 secrets -WorkDir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $first = Get-Content -Raw (Join-Path $dir 'secrets\db_password.txt')
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\polymer.ps1 secrets -WorkDir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $second = Get-Content -Raw (Join-Path $dir 'secrets\db_password.txt')
          if ($first -ne $second) { throw 'secrets no es idempotente' }
          foreach ($f in 'db_password.txt', 'grafana_password.txt', 'demo_password.txt', 'rabbitmq_password.txt') {
            $value = [IO.File]::ReadAllText((Join-Path $dir "secrets\$f"))
            if ($value -notmatch '^[0-9a-f]{48}$') { throw "Secreto inválido en ${f}: longitud $($value.Length)" }
          }
          Write-Host 'Secretos correctos.'
      - name: Memorable secrets for a new install (Windows PowerShell 5.1, never printed)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'secrets-memorable'
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File tools\polymer.ps1 secrets -Memorable -AssumeYes -WorkDir $dir | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $out; exit 1 }
          $values = foreach ($f in 'db_password.txt', 'grafana_password.txt', 'demo_password.txt', 'rabbitmq_password.txt') {
            $value = [IO.File]::ReadAllText((Join-Path $dir "secrets\$f"))
            if ($value -cnotmatch '^([A-Z][a-z]+-){5}\d{2}[!#%+=@]$') { throw "Frase memorable inválida en $f" }
            if ($out.Contains($value)) { throw "La salida mostró la contraseña de $f" }
            $value
          }
          if (@($values | Sort-Object -Unique).Count -ne 4) { throw 'Se repitió una contraseña entre servicios' }
          Write-Host 'Frases memorables correctas: distintas por servicio y nunca impresas.'
      - name: Install Python tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tools.txt -r services/risk-engine/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Delivery up to date and valid on Windows (Windows PowerShell 5.1 check)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\polymer.ps1 check
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Unit tests on Windows (polymer.cmd test)
        run: |
          .\polymer.cmd test
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # v5: el modo básico (6 contenedores, sin el perfil "full") también debe funcionar completo:
  # gateway, pedidos, plataforma, persistencia tras reiniciar y HTTP 503 sin risk-engine.
  compose-basic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DB_PASSWORD: ci-only-ephemeral-db-password
      GRAFANA_PASSWORD: ci-only-ephemeral-grafana-password
      DEMO_PASSWORD: ci-only-demo-password-2026
      RABBITMQ_PASSWORD: ci-only-ephemeral-rabbitmq-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify basic mode end to end (tools/polymer.ps1 verify -Mode basic)
        run: ./tools/polymer.ps1 verify -Mode basic -WorkDir (Join-Path $env:RUNNER_TEMP 'polymer-basic')
      - name: Show diagnostics on failure
        if: failure()
        run: ./tools/polymer.ps1 diagnose -WorkDir (Join-Path $env:RUNNER_TEMP 'polymer-basic')
      - name: Cleanup ephemeral CI resources
        if: always()
        run: ./tools/polymer.ps1 cleanup -WorkDir (Join-Path $env:RUNNER_TEMP 'polymer-basic')

  # Actualización REAL de un usuario: HexaOrders v6 en marcha (13 contenedores) con datos y
  # contraseñas aleatorias → POLYMER descomprimido en OTRA carpeta, sin secrets\ (el ZIP nunca
  # incluye contraseñas) → polymer.ps1 start. Debe recuperar las contraseñas originales, copiar y
  # verificar los volúmenes hexaorders_* → polymer_*, conservar los originales, arrancar los 13
  # contenedores y mantener intactos pedidos, usuarios y mensajes.
  migrate-from-v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python tooling
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt
      - name: HexaOrders v6 (commit 6cc87c0) en marcha con datos, como en el equipo del usuario
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/Descargas/HexaOrders-v6"
          mkdir -p "$OLD"
          git show 6cc87c0:docker-compose.yml > "$OLD/docker-compose.yml"
          git show 6cc87c0:tools/init-env.ps1 > "$RUNNER_TEMP/init-env-v6.ps1"
          # Sin variables de entorno: contraseñas aleatorias, distintas de las que generaría POLYMER.
          pwsh -NoProfile -File "$RUNNER_TEMP/init-env-v6.ps1" -Root "$OLD"
          docker compose -f "$OLD/docker-compose.yml" --profile full up -d --wait --wait-timeout 420
          test "$(docker compose -f "$OLD/docker-compose.yml" --profile full ps -q | wc -l)" -eq 13
          ORDER=$(curl -sf -X POST http://127.0.0.1:8080/api/orders -H 'Content-Type: application/json' \
                  -d '{"customerId":"cliente-v6","amount":321.50}' | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          docker compose -f "$OLD/docker-compose.yml" exec -T db psql -U orders -d orders -v ON_ERROR_STOP=1 -tAc \
            "INSERT INTO contact_messages (name, email, topic, message) VALUES ('Migración CI', 'ci@example.com', 'OTHER', 'Dato creado en HexaOrders v6 antes de migrar')"
          COUNTS=$(docker compose -f "$OLD/docker-compose.yml" exec -T db psql -U orders -d orders -tAc \
            "SELECT (SELECT count(*) FROM orders) || '/' || (SELECT count(*) FROM app_users) || '/' || (SELECT count(*) FROM products) || '/' || (SELECT count(*) FROM contact_messages)")
          echo "Pedido v6: $ORDER · pedidos/usuarios/productos/mensajes: $COUNTS"
          printf '%s\n%s\n' "$ORDER" "$COUNTS" > "$RUNNER_TEMP/v6-state.txt"
      - name: POLYMER en otra carpeta SIN secrets\ → polymer.ps1 start (importa secretos y migra volúmenes)
        run: |
          $new = Join-Path $env:RUNNER_TEMP 'Descargas/POLYMER'
          New-Item -ItemType Directory -Force $new | Out-Null
          Copy-Item docker-compose.yml $new
          if (Test-Path (Join-Path $new 'secrets')) { throw 'La carpeta nueva no debería tener secrets' }
          ./tools/polymer.ps1 start -WorkDir $new -AssumeYes
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Comprobar datos conservados, 13 contenedores sanos y volúmenes originales intactos
        shell: bash
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/Descargas/POLYMER"
          ORDER=$(sed -n 1p "$RUNNER_TEMP/v6-state.txt"); BEFORE=$(sed -n 2p "$RUNNER_TEMP/v6-state.txt")
          C="docker compose -f $NEW/docker-compose.yml"
          RUNNING=$($C ps --status running -q | wc -l)
          echo "Contenedores polymer en marcha: $RUNNING"; $C ps
          test "$RUNNING" -eq 13
          test "$($C ps --format '{{.Health}}' | grep -c unhealthy || true)" -eq 0
          for v in postgres_data prometheus_data grafana_data redis_data rabbitmq_data loki_data tempo_data alloy_data; do
            docker volume inspect "hexaorders_$v" >/dev/null   # el original sigue existiendo
            docker volume inspect "polymer_$v" >/dev/null
          done
          echo "Volúmenes: 8 originales conservados y 8 polymer_* migrados"
          cat "$NEW/polymer-migration.log"
          cmp -s "$NEW/secrets/db_password.txt" "$RUNNER_TEMP/Descargas/HexaOrders-v6/secrets/db_password.txt"
          cmp -s "$NEW/secrets/grafana_password.txt" "$RUNNER_TEMP/Descargas/HexaOrders-v6/secrets/grafana_password.txt"
          echo "Contraseñas originales importadas (sin mostrarlas)"
          AFTER=$($C exec -T db psql -U orders -d orders -tAc \
            "SELECT (SELECT count(*) FROM orders) || '/' || (SELECT count(*) FROM app_users) || '/' || (SELECT count(*) FROM products) || '/' || (SELECT count(*) FROM contact_messages)")
          echo "Antes: $BEFORE · después: $AFTER"
          test "$BEFORE" = "$AFTER"
          curl -sf "http://127.0.0.1:8080/api/orders/$ORDER" | python -c 'import json,sys; o=json.load(sys.stdin); assert o["customerId"]=="cliente-v6" and float(o["amount"])==321.5, o; print("Pedido de la v6 intacto:", o["id"])'
          test "$($C exec -T db psql -U orders -d orders -tAc "SELECT count(*) FROM contact_messages WHERE name = 'Migración CI'")" -eq 1
          test "$($C exec -T db psql -U orders -d orders -tAc "SELECT max(version::int) FROM flyway_schema_history")" -eq 10
          # V10 solo crea user_preferences: no toca usuarios ni hashes (el idioma por defecto es español).
          test "$($C exec -T db psql -U orders -d orders -tAc "SELECT to_regclass('public.user_preferences') IS NOT NULL")" = "t"
          test "$($C exec -T db psql -U orders -d orders -tAc "SELECT display_name FROM app_users WHERE username = 'admin'")" = "Administración Polymer"
          test "$($C exec -T db psql -U orders -d orders -tAc "SELECT count(*) FROM products WHERE brand = 'Polymer'")" -ge 1
          python tools/platform_smoke.py --demo-password-file "$NEW/secrets/demo_password.txt"
          python tools/store_smoke.py --demo-password-file "$NEW/secrets/demo_password.txt"
      - name: change-password para PostgreSQL, Grafana y RabbitMQ (copia, verificación y servicios sanos)
        run: |
          $new = Join-Path $env:RUNNER_TEMP 'Descargas/POLYMER'
          $before = @{}
          foreach ($svc in 'db', 'grafana', 'rabbitmq') {
            $file = Join-Path $env:RUNNER_TEMP "new-$svc.txt"
            [IO.File]::WriteAllText($file, "Cambio-$svc-Faro-Nube-Cobre-2026!")
            $out = ./tools/polymer.ps1 change-password -Service $svc -NewPasswordFile $file -AssumeYes -WorkDir $new | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if ($out.Contains("Cambio-$svc-Faro")) { throw "La salida mostró la contraseña de $svc" }
          }
          $backups = @(Get-ChildItem (Join-Path $new 'secrets/backup') -Filter *.bak)
          if ($backups.Count -ne 3) { throw "Se esperaban 3 copias de seguridad y hay $($backups.Count)" }
          if ([IO.File]::ReadAllText((Join-Path $new 'secrets/db_password.txt')) -cne 'Cambio-db-Faro-Nube-Cobre-2026!') { throw 'db_password.txt no se actualizó' }
          # Todo sigue funcionando con las contraseñas nuevas: pedidos, plataforma, integraciones (RabbitMQ, Grafana…).
          ./tools/polymer.ps1 smoke -WorkDir $new
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Segunda ejecución de migrate (idempotente, no vuelve a copiar)
        run: |
          ./tools/polymer.ps1 migrate -WorkDir (Join-Path $env:RUNNER_TEMP 'Descargas/POLYMER')
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Show diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a
          docker volume ls
          for c in $(docker ps -aq); do echo "== $(docker inspect -f '{{.Name}}' $c)"; docker logs --tail 60 $c 2>&1 | tail -60; done
