name: Verify HexaOrders
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DB_PASSWORD: ci-only-ephemeral-db-password
      GRAFANA_PASSWORD: ci-only-ephemeral-grafana-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/generate_delivery.py --check
      - name: Validate and build the single-file delivery
        run: |
          mkdir -p "$RUNNER_TEMP/hexaorders-delivery"
          cp docker-compose.yml "$RUNNER_TEMP/hexaorders-delivery/docker-compose.yml"
          cd "$RUNNER_TEMP/hexaorders-delivery"
          docker compose config --quiet
          docker compose build --pull
      - name: Validate Prometheus configuration and rules
        working-directory: ${{ runner.temp }}/hexaorders-delivery
        run: docker compose run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
      - name: Start all five services
        working-directory: ${{ runner.temp }}/hexaorders-delivery
        run: docker compose up -d --wait --wait-timeout 240
      - name: Verify orders, persistence, metrics and provisioned dashboard
        run: python tools/smoke.py
      - name: Verify risk failure is HTTP 503
        working-directory: ${{ runner.temp }}/hexaorders-delivery
        run: |
          docker compose stop risk-engine
          code=$(curl -sS -o /tmp/risk-failure.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"customerId":"demo-001","amount":125.50}' http://127.0.0.1:8080/api/orders)
          test "$code" = 503
          docker compose start risk-engine
          docker compose up -d --wait --wait-timeout 120
      - name: Show diagnostics on failure
        if: failure()
        working-directory: ${{ runner.temp }}/hexaorders-delivery
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Cleanup ephemeral CI resources
        if: always()
        working-directory: ${{ runner.temp }}/hexaorders-delivery
        run: docker compose down -v --remove-orphans
