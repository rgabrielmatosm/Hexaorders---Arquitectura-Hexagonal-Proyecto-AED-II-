{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "monitoring-config",
    "namespace": "hexaorders"
  },
  "data": {
    "prometheus.yml": "global:\n  scrape_interval: 10s\n  evaluation_interval: 10s\n  external_labels:\n    project: hexaorders\nrule_files:\n  - /etc/prometheus/alerts.yml\nscrape_configs:\n  - job_name: order-api\n    metrics_path: /actuator/prometheus\n    static_configs:\n      - targets: [order-api:9090]\n  - job_name: risk-engine\n    metrics_path: /metrics\n    static_configs:\n      - targets: [risk-engine:8000]\n  - job_name: prometheus\n    static_configs:\n      - targets: [localhost:9090]\n\n",
    "alerts.yml": "groups:\n  - name: hexaorders\n    rules:\n      - alert: HexaOrdersServiceDown\n        expr: up{job=~\"order-api|risk-engine\"} == 0\n        for: 30s\n        labels:\n          severity: critical\n        annotations:\n          summary: 'Servicio {{ $labels.job }} sin respuesta'\n          description: 'Prometheus no puede recopilar métricas durante al menos 30 segundos.'\n      - alert: RiskRequestsFailing\n        expr: increase(orders_risk_failures_total[2m]) > 0\n        for: 10s\n        labels:\n          severity: warning\n        annotations:\n          summary: 'Falló una evaluación de riesgo'\n          description: 'Revisar risk-engine y los tiempos de espera HTTP de order-api.'\n\n\n  # Compatibilidad (v3). Defecto previo corregido: el cliente Java de Prometheus 1.x (Spring Boot 3.5)\n  # reserva el sufijo _created y exporta el contador Micrometer \"orders_created\" como orders_total.\n  # Esta regla republica la serie con su nombre original para que los paneles y consultas existentes\n  # (orders_created_total) muestren datos sin modificarlos.\n  - name: hexaorders-compat\n    rules:\n      - record: orders_created_total\n        expr: orders_total\n\n  # Alertas añadidas en la versión 3 (las dos alertas originales de arriba no se modifican).\n  - name: hexaorders-platform\n    rules:\n      - alert: RiskEngineDown\n        expr: up{job=\"risk-engine\"} == 0\n        for: 30s\n        labels:\n          severity: critical\n        annotations:\n          summary: 'Motor de riesgo no disponible'\n          description: 'Los checkouts y pedidos nuevos responden 503 hasta que vuelva risk-engine.'\n      - alert: HexaOrdersHighErrorRate\n        expr: sum(rate(http_server_requests_seconds_count{job=\"order-api\",status=~\"5..\"}[2m])) > 0.05\n        for: 2m\n        labels:\n          severity: warning\n        annotations:\n          summary: 'Aumento de errores HTTP 5xx en order-api'\n          description: 'Más de 0,05 respuestas 5xx por segundo durante 2 minutos.'\n      - alert: HexaOrdersHighLatency\n        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=\"order-api\",uri=~\"/api/.*\"}[5m]))) > 1\n        for: 5m\n        labels:\n          severity: warning\n        annotations:\n          summary: 'Latencia p95 de la API superior a 1 s'\n          description: 'Revisar PostgreSQL, el motor de riesgo y los recursos de order-api.'\n      - alert: HexaOrdersCheckoutFailures\n        expr: sum(increase(hexaorders_checkout_failures_total{reason=\"risk_unavailable\"}[5m])) > 3\n        for: 1m\n        labels:\n          severity: warning\n        annotations:\n          summary: 'Fallos recurrentes de integración Java-Python en el checkout'\n          description: 'Más de 3 checkouts rechazados por indisponibilidad del motor de riesgo en 5 minutos.'\n      - alert: HexaOrdersPendingReviewGrowing\n        expr: hexaorders_orders_by_status{status=\"RISK_REVIEW\"} > 10\n        for: 10m\n        labels:\n          severity: info\n        annotations:\n          summary: 'Pedidos pendientes de revisión acumulándose'\n          description: 'Más de 10 pedidos en RISK_REVIEW durante 10 minutos: asignar operadores.'\n      - alert: HexaOrdersAuthFailuresSpike\n        expr: sum(increase(hexaorders_auth_logins_total{outcome=\"failure\"}[5m])) > 10\n        for: 1m\n        labels:\n          severity: warning\n        annotations:\n          summary: 'Muchos inicios de sesión fallidos'\n          description: 'Más de 10 credenciales incorrectas en 5 minutos: posible ataque de fuerza bruta.'\n      - alert: HexaOrdersLowStock\n        expr: hexaorders_products_low_stock > 0\n        for: 15m\n        labels:\n          severity: info\n        annotations:\n          summary: 'Productos con stock bajo'\n          description: 'Hay productos activos con 5 unidades o menos.'\n",
    "datasource.yml": "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n    isDefault: true\n    editable: false\n    jsonData:\n      timeInterval: 10s\n\n",
    "dashboards.yml": "apiVersion: 1\nproviders:\n  - name: HexaOrders\n    orgId: 1\n    folder: HexaOrders\n    type: file\n    disableDeletion: true\n    editable: false\n    options:\n      path: /etc/grafana/dashboards\n\n",
    "hexaorders.json": "{\n  \"id\": null,\n  \"uid\": \"hexaorders\",\n  \"title\": \"HexaOrders · Puertos, adaptadores y métricas\",\n  \"tags\": [\"hexagonal\", \"java\", \"python\"],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 2,\n  \"refresh\": \"10s\",\n  \"time\": {\"from\": \"now-15m\", \"to\": \"now\"},\n  \"panels\": [\n    {\n      \"id\": 1, \"title\": \"Servicios disponibles (1 = UP)\", \"type\": \"stat\",\n      \"gridPos\": {\"h\": 5, \"w\": 8, \"x\": 0, \"y\": 0},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"up{job=~\\\"order-api|risk-engine\\\"}\", \"legendFormat\": \"{{job}}\", \"instant\": true}],\n      \"fieldConfig\": {\"defaults\": {\"min\": 0, \"max\": 1, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"green\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"value_and_name\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}\n    },\n    {\n      \"id\": 2, \"title\": \"Pedidos creados desde el arranque de Java\", \"type\": \"stat\",\n      \"gridPos\": {\"h\": 5, \"w\": 8, \"x\": 8, \"y\": 0},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(orders_created_total) or vector(0)\", \"instant\": true}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0}, \"overrides\": []},\n      \"options\": {\"colorMode\": \"value\", \"graphMode\": \"area\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}\n    },\n    {\n      \"id\": 3, \"title\": \"Fallos de riesgo desde el arranque de Java\", \"type\": \"stat\",\n      \"gridPos\": {\"h\": 5, \"w\": 8, \"x\": 16, \"y\": 0},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(orders_risk_failures_total) or vector(0)\", \"instant\": true}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0}, \"overrides\": []},\n      \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}\n    },\n    {\n      \"id\": 4, \"title\": \"Pedidos por estado / segundo\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 5},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(status)(rate(orders_created_total[2m]))\", \"legendFormat\": \"{{status}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 5, \"title\": \"Evaluaciones de riesgo / segundo\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 5},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(decision)(rate(risk_evaluations_total[2m]))\", \"legendFormat\": \"{{decision}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 6, \"title\": \"Latencia p95 API de pedidos\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 13},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by(le)(rate(http_server_requests_seconds_bucket{uri=~\\\"/api/orders.*\\\"}[2m])))\", \"legendFormat\": \"p95 REST\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 7, \"title\": \"Latencia p95 evaluación de riesgo Python\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 13},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by(le)(rate(risk_evaluation_duration_seconds_bucket[2m])))\", \"legendFormat\": \"p95 riesgo\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 8, \"title\": \"Respuestas HTTP /api/orders por código / segundo\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 21},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(status)(rate(http_server_requests_seconds_count{uri=~\\\"/api/orders.*\\\"}[2m]))\", \"legendFormat\": \"HTTP {{status}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 9, \"title\": \"Errores HTTP 5xx / segundo (p. ej. 503 si cae el motor de riesgo)\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 21},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(uri, status)(rate(http_server_requests_seconds_count{status=~\\\"5..\\\"}[2m])) or vector(0)\", \"legendFormat\": \"{{status}} {{uri}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"min\": 0, \"color\": {\"mode\": \"fixed\", \"fixedColor\": \"red\"}}, \"overrides\": []}\n    }\n  ],\n  \"annotations\": {\"list\": []}\n}\n\n",
    "hexaorders-business.json": "{\n  \"id\": null,\n  \"uid\": \"hexaorders-business\",\n  \"title\": \"HexaOrders — Business Operations\",\n  \"description\": \"Ciclo de vida de pedidos, checkout, logística e incidencias. Fuente: métricas hexaorders_* de order-api.\",\n  \"tags\": [\n    \"hexaorders\",\n    \"business\",\n    \"v3\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Pedidos registrados (PostgreSQL)\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status)\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#8B5CF6\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 0\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Pendientes de revisión de riesgo\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=\\\"RISK_REVIEW\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#10B981\",\n                \"value\": null\n              },\n              {\n                \"color\": \"#F59E0B\",\n                \"value\": 5\n              },\n              {\n                \"color\": \"#EF4444\",\n                \"value\": 10\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 0\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"En preparación / listos\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=~\\\"CONFIRMED|PREPARING|READY_FOR_DISPATCH\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#8B5CF6\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 0\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Entregados\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=\\\"DELIVERED\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#10B981\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 0\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Aprobados por riesgo (sin confirmar)\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=\\\"RISK_APPROVED\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#10B981\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 5\n      }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"En tránsito\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=\\\"IN_TRANSIT\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#8B5CF6\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 5\n      }\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Rechazados\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=\\\"REJECTED\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#EF4444\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 5\n      }\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Cancelados\",\n      \"type\": \"stat\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(hexaorders_orders_by_status{status=\\\"CANCELLED\\\"})\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"#F59E0B\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"textMode\": \"value_and_name\",\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 5\n      }\n    },\n    {\n      \"id\": 9,\n      \"title\": \"Pedidos por estado del ciclo de vida\",\n      \"type\": \"bargauge\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (status) (hexaorders_orders_by_status)\",\n          \"legendFormat\": \"{{status}}\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"color\": {\n            \"mode\": \"continuous-BlPu\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"orientation\": \"horizontal\",\n        \"displayMode\": \"gradient\",\n        \"showUnfilled\": true,\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 10\n      }\n    },\n    {\n      \"id\": 10,\n      \"title\": \"Pedidos creados por decisión de riesgo / min (todos los canales)\",\n      \"type\": \"timeseries\",\n      \"description\": \"orders_created_total: contador original (republicado por la regla de compatibilidad).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (status) (rate(orders_created_total[5m])) * 60\",\n          \"legendFormat\": \"{{status}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"custom\": {\n            \"fillOpacity\": 18,\n            \"lineWidth\": 2,\n            \"stacking\": {\n              \"mode\": \"none\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\"\n        }\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 10\n      }\n    },\n    {\n      \"id\": 11,\n      \"title\": \"Pedidos del portal por decisión de riesgo / min\",\n      \"type\": \"timeseries\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (risk_decision) (rate(hexaorders_shop_orders_placed_total[5m])) * 60\",\n          \"legendFormat\": \"{{risk_decision}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"custom\": {\n            \"fillOpacity\": 18,\n            \"lineWidth\": 2,\n            \"stacking\": {\n              \"mode\": \"none\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n    