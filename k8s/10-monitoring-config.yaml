{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "monitoring-config",
    "namespace": "hexaorders"
  },
  "data": {
    "prometheus.yml": "global:\n  scrape_interval: 10s\n  evaluation_interval: 10s\n  external_labels:\n    project: hexaorders\nrule_files:\n  - /etc/prometheus/alerts.yml\nscrape_configs:\n  - job_name: order-api\n    metrics_path: /actuator/prometheus\n    static_configs:\n      - targets: [order-api:9090]\n  - job_name: risk-engine\n    metrics_path: /metrics\n    static_configs:\n      - targets: [risk-engine:8000]\n  - job_name: prometheus\n    static_configs:\n      - targets: [localhost:9090]\n\n",
    "alerts.yml": "groups:\n  - name: hexaorders\n    rules:\n      - alert: HexaOrdersServiceDown\n        expr: up{job=~\"order-api|risk-engine\"} == 0\n        for: 30s\n        labels:\n          severity: critical\n        annotations:\n          summary: 'Servicio {{ $labels.job }} sin respuesta'\n          description: 'Prometheus no puede recopilar métricas durante al menos 30 segundos.'\n      - alert: RiskRequestsFailing\n        expr: increase(orders_risk_failures_total[2m]) > 0\n        for: 10s\n        labels:\n          severity: warning\n        annotations:\n          summary: 'Falló una evaluación de riesgo'\n          description: 'Revisar risk-engine y los tiempos de espera HTTP de order-api.'\n\n",
    "datasource.yml": "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n    isDefault: true\n    editable: false\n    jsonData:\n      timeInterval: 10s\n\n",
    "dashboards.yml": "apiVersion: 1\nproviders:\n  - name: HexaOrders\n    orgId: 1\n    folder: HexaOrders\n    type: file\n    disableDeletion: true\n    editable: false\n    options:\n      path: /etc/grafana/dashboards\n\n",
    "hexaorders.json": "{\n  \"id\": null,\n  \"uid\": \"hexaorders\",\n  \"title\": \"HexaOrders · Puertos, adaptadores y métricas\",\n  \"tags\": [\"hexagonal\", \"java\", \"python\"],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 2,\n  \"refresh\": \"10s\",\n  \"time\": {\"from\": \"now-15m\", \"to\": \"now\"},\n  \"panels\": [\n    {\n      \"id\": 1, \"title\": \"Servicios disponibles (1 = UP)\", \"type\": \"stat\",\n      \"gridPos\": {\"h\": 5, \"w\": 8, \"x\": 0, \"y\": 0},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"up{job=~\\\"order-api|risk-engine\\\"}\", \"legendFormat\": \"{{job}}\", \"instant\": true}],\n      \"fieldConfig\": {\"defaults\": {\"min\": 0, \"max\": 1, \"thresholds\": {\"mode\": \"absolute\", \"steps\": [{\"color\": \"red\", \"value\": null}, {\"color\": \"green\", \"value\": 1}]}}, \"overrides\": []},\n      \"options\": {\"colorMode\": \"background\", \"graphMode\": \"none\", \"textMode\": \"value_and_name\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}\n    },\n    {\n      \"id\": 2, \"title\": \"Pedidos creados desde el arranque de Java\", \"type\": \"stat\",\n      \"gridPos\": {\"h\": 5, \"w\": 8, \"x\": 8, \"y\": 0},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(orders_created_total) or vector(0)\", \"instant\": true}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0}, \"overrides\": []},\n      \"options\": {\"colorMode\": \"value\", \"graphMode\": \"area\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}\n    },\n    {\n      \"id\": 3, \"title\": \"Fallos de riesgo desde el arranque de Java\", \"type\": \"stat\",\n      \"gridPos\": {\"h\": 5, \"w\": 8, \"x\": 16, \"y\": 0},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum(orders_risk_failures_total) or vector(0)\", \"instant\": true}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"short\", \"decimals\": 0}, \"overrides\": []},\n      \"options\": {\"colorMode\": \"value\", \"graphMode\": \"none\", \"reduceOptions\": {\"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\": false}}\n    },\n    {\n      \"id\": 4, \"title\": \"Pedidos por estado / segundo\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 5},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(status)(rate(orders_created_total[2m]))\", \"legendFormat\": \"{{status}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 5, \"title\": \"Evaluaciones de riesgo / segundo\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 5},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(decision)(rate(risk_evaluations_total[2m]))\", \"legendFormat\": \"{{decision}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"ops\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 6, \"title\": \"Latencia p95 API de pedidos\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 13},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by(le)(rate(http_server_requests_seconds_bucket{uri=~\\\"/api/orders.*\\\"}[2m])))\", \"legendFormat\": \"p95 REST\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 7, \"title\": \"Latencia p95 evaluación de riesgo Python\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 13},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"histogram_quantile(0.95, sum by(le)(rate(risk_evaluation_duration_seconds_bucket[2m])))\", \"legendFormat\": \"p95 riesgo\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"s\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 8, \"title\": \"Respuestas HTTP /api/orders por código / segundo\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 0, \"y\": 21},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(status)(rate(http_server_requests_seconds_count{uri=~\\\"/api/orders.*\\\"}[2m]))\", \"legendFormat\": \"HTTP {{status}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"min\": 0}, \"overrides\": []}\n    },\n    {\n      \"id\": 9, \"title\": \"Errores HTTP 5xx / segundo (p. ej. 503 si cae el motor de riesgo)\", \"type\": \"timeseries\",\n      \"gridPos\": {\"h\": 8, \"w\": 12, \"x\": 12, \"y\": 21},\n      \"datasource\": {\"type\": \"prometheus\", \"uid\": \"prometheus\"},\n      \"targets\": [{\"refId\": \"A\", \"expr\": \"sum by(uri, status)(rate(http_server_requests_seconds_count{status=~\\\"5..\\\"}[2m])) or vector(0)\", \"legendFormat\": \"{{status}} {{uri}}\"}],\n      \"fieldConfig\": {\"defaults\": {\"unit\": \"reqps\", \"min\": 0, \"color\": {\"mode\": \"fixed\", \"fixedColor\": \"red\"}}, \"overrides\": []}\n    }\n  ],\n  \"annotations\": {\"list\": []}\n}\n\n"
  }
}
