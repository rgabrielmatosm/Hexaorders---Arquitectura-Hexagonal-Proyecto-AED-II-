apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: polymer
spec:
  type: ClusterIP
  selector:
    app: risk-engine
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: polymer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
        app.kubernetes.io/part-of: polymer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk-engine
          image: polymer/risk-engine:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: polymer
spec:
  type: ClusterIP
  selector:
    app: order-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9090
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: polymer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
        app.kubernetes.io/part-of: polymer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-api
          image: polymer/order-api:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: orders
            - name: DB_USER
              value: orders
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db_password
            # v3: contraseña de las cuentas de demostración (clave opcional del Secret app-secrets).
            - name: DEMO_PASSWORD_FILE
              value: /run/demo-secrets/demo_password
            - name: RISK_BASE_URL
              value: http://risk-engine:8000
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          # Liveness is process-only; readiness additionally checks the DB.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: db-secret
              mountPath: /run/secrets
              readOnly: true
            - name: demo-secret
              mountPath: /run/demo-secrets
              readOnly: true
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-secret
          secret:
            secretName: app-secrets
            defaultMode: 0440
            items:
              - key: db_password
                path: db_password
        # optional: los Secrets creados antes de la v3 (sin demo_password) siguen siendo válidos.
        - name: demo-secret
          secret:
            secretName: app-secrets
            defaultMode: 0440
            optional: true
            items:
              - key: demo_password
                path: demo_password
